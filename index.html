<script src="https://secure.rapid-gateway.com/sdk/v1/rapidpay.js"></script>

<script>
(function () {

  const button = document.getElementById("lh-start-payment");
  const modal = document.getElementById("lh-rapidpay-modal");
  const close = document.getElementById("lh-close-payment");
  const status = document.getElementById("lh-payment-status");
  const email = document.getElementById("lh-test-email");
  const mobile = document.getElementById("lh-test-mobile");
  const service = document.getElementById("lh-test-service");
  const checkout = document.getElementById("rapidpay-checkout");

  if (!button) return;

  function setStatus(message) {
    if (status) {
      status.textContent = message;
    }
  }

  function hidePayment() {
    if (modal) {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    if (checkout) {
      checkout.innerHTML = "";
    }
  }

  if (close) {
    close.addEventListener("click", hidePayment);
  }

  if (modal) {
    modal.addEventListener("click", function (event) {
      if (event.target === modal) {
        hidePayment();
      }
    });
  }

  button.addEventListener("click", async function () {

    button.disabled = true;

    setStatus("Preparing secure checkout...");

    try {

      const customerEmail = email
        ? email.value.trim()
        : "";

      const customerMobile = mobile
        ? mobile.value.trim()
        : "";

      const amount = service
        ? Number(service.value)
        : 100;

      if (!customerEmail) {
        throw new Error("Please enter your email address.");
      }

      if (!customerMobile) {
        throw new Error("Please enter your mobile number.");
      }

      if (!amount) {
        throw new Error("Please select a payment amount.");
      }

      /*
       * Send payment request to Cloudflare Pages Function.
       * The Rapid Gateway credentials remain on the server.
       */

      const response = await fetch(
        "/api/rapidpay/create-checkout",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            amount: amount,
            currency: "PKR",
            basketId:
              "LH-TEST-" + Date.now(),
            customerEmail: customerEmail,
            customerMobile: customerMobile
          })
        }
      );

      /*
       * IMPORTANT:
       * Read as text first so an empty/non-JSON response
       * does not produce:
       *
       * Unexpected end of JSON input
       */

      const rawResponse = await response.text();

      let data = null;

      if (rawResponse.trim()) {
        try {
          data = JSON.parse(rawResponse);
        } catch (jsonError) {
          throw new Error(
            "Server returned an invalid response. HTTP " +
            response.status +
            ": " +
            rawResponse.substring(0, 500)
          );
        }
      }

      if (!response.ok) {

        throw new Error(
          data && data.error
            ? data.error
            : "Unable to create Rapid Gateway checkout. HTTP " +
              response.status
        );
      }

      if (!data) {
        throw new Error(
          "The payment server returned an empty response."
        );
      }

      if (!data.publishableKey) {
        throw new Error(
          data.error ||
          "Rapid Gateway did not return a publishable key."
        );
      }

      if (!data.clientSecret) {
        throw new Error(
          data.error ||
          "Rapid Gateway did not return a client secret."
        );
      }

      /*
       * Open payment modal
       */

      if (modal) {
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
      }

      setStatus(
        "Secure checkout opened."
      );

      /*
       * Make sure RapidPay SDK has loaded
       */

      if (!window.RapidPay) {
        throw new Error(
          "RapidPay SDK did not load. Please refresh the page and try again."
        );
      }

      /*
       * Mount Rapid Gateway checkout
       */

      window.RapidPay(
        data.publishableKey
      ).mountCheckout(
        "#rapidpay-checkout",
        {
          clientSecret:
            data.clientSecret,

          amount:
            data.amount || amount,

          currency:
            data.currency || "PKR",

          merchantName:
            "Learning Hub",

          onSuccess:
            function () {

              setStatus(
                "Payment completed. We are securely confirming your payment."
              );

            },

          onPending:
            function () {

              setStatus(
                "Payment is pending confirmation."
              );

            },

          onError:
            function (error) {

              console.error(
                "RapidPay error:",
                error
              );

              setStatus(
                "Payment could not be completed. Please try again."
              );

            }
        }
      );

    } catch (error) {

      console.error(
        "Learning Hub payment error:",
        error
      );

      setStatus(
        error.message ||
        "Unable to start payment."
      );

    } finally {

      button.disabled = false;

    }

  });

})();
</script>

</body>
</html>

<style>
:root{
  --black:#070707;
  --black2:#0d0d0d;
  --black3:#151515;
  --gold:#c9a45c;
  --gold2:#f0d58e;
  --gold3:#8e6b2d;
  --cream:#f4eee2;
  --cream2:#e8deca;
  --ivory:#fbf8f1;
  --white:#fffdf8;
  --text:#171512;
  --muted:#777168;
  --darkmuted:#bcb4a7;
  --line:rgba(201,164,92,.25);
  --shadow:0 25px 70px rgba(0,0,0,.22);
  --radius:24px
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:"DM Sans",sans-serif;
  background:var(--ivory);
  color:var(--text);
  line-height:1.65;
  overflow-x:hidden
}

img{display:block;width:100%}

a{color:inherit;text-decoration:none}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.container{
  width:min(1200px,calc(100% - 36px));
  margin:auto
}

section{
  padding:100px 0;
  position:relative
}

.section-heading{
  max-width:760px;
  margin-bottom:55px
}

.section-heading.center{
  text-align:center;
  margin-left:auto;
  margin-right:auto
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold3);
  margin-bottom:16px
}

.eyebrow::before{
  content:"";
  width:28px;
  height:1px;
  background:currentColor
}

.dark .eyebrow{color:var(--gold2)}

h1,h2,h3{
  font-family:"Playfair Display",serif;
  line-height:1.1
}

h1{font-size:clamp(3rem,7vw,6.6rem)}

h2{font-size:clamp(2.2rem,4vw,4rem)}

h3{font-size:1.45rem}

p{color:var(--muted)}

.dark p{color:var(--darkmuted)}


/* NAVIGATION */

.navbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  background:rgba(7,7,7,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(201,164,92,.18)
}

.nav-inner{
  height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0
}

.brand-mark{
  width:48px;
  height:48px;
  border:1px solid var(--gold);
  display:grid;
  place-items:center;
  color:var(--gold2);
  font-family:"Playfair Display",serif;
  font-size:1.25rem
}

.brand-copy strong{
  display:block;
  color:var(--white);
  font-size:1rem
}

.brand-copy small{
  display:block;
  color:var(--darkmuted);
  font-size:.68rem;
  letter-spacing:.08em;
  text-transform:uppercase
}

.nav-links{
  display:flex;
  align-items:center;
  gap:22px
}

.nav-links a{
  font-size:.78rem;
  color:#ddd7cc;
  transition:.25s
}

.nav-links a:hover{color:var(--gold2)}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:46px;
  padding:0 20px;
  border-radius:999px;
  border:1px solid transparent;
  font-weight:700;
  font-size:.85rem;
  transition:.3s
}

.btn-gold{
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#17130c
}

.btn-gold:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(201,164,92,.25)
}

.btn-outline{
  border-color:var(--gold);
  color:var(--gold2)
}

.btn-outline:hover{
  background:var(--gold);
  color:#111
}

.mobile-toggle{
  display:none;
  background:none;
  border:1px solid var(--line);
  color:var(--gold2);
  width:44px;
  height:44px;
  border-radius:50%;
  font-size:1.2rem
}


/* HERO */

.hero{
  min-height:100vh;
  padding-top:150px;
  background:
    linear-gradient(90deg,rgba(7,7,7,.96) 0%,rgba(7,7,7,.78) 46%,rgba(7,7,7,.30) 100%),
    url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=2200&q=85") center/cover;
  color:var(--white);
  display:flex;
  align-items:center;
  overflow:hidden
}

.hero::after{
  content:"";
  position:absolute;
  inset:auto -100px -150px auto;
  width:450px;
  height:450px;
  border-radius:50%;
  background:rgba(201,164,92,.12);
  filter:blur(70px)
}

.hero-content{
  max-width:850px;
  position:relative;
  z-index:2
}

.hero .eyebrow{color:var(--gold2)}

.hero p{
  max-width:690px;
  font-size:1.08rem;
  margin:25px 0 35px;
  color:#ddd7cd
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap
}

.hero-statbar{
  margin-top:65px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)
}

.hero-stat{
  padding:20px 12px;
  border-right:1px solid var(--line)
}

.hero-stat:last-child{border-right:0}

.hero-stat strong{
  display:block;
  color:var(--gold2);
  font-size:1rem;
  margin-bottom:3px
}

.hero-stat span{
  font-size:.72rem;
  color:#aaa398
}


/* INTRO */

.intro{background:var(--cream)}

.intro-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center
}

.intro-image{
  border-radius:28px;
  overflow:hidden;
  height:520px;
  box-shadow:var(--shadow);
  position:relative
}

.intro-image img{
  height:100%;
  object-fit:cover
}

.image-caption{
  position:absolute;
  left:20px;
  right:20px;
  bottom:20px;
  padding:20px;
  background:rgba(7,7,7,.78);
  backdrop-filter:blur(15px);
  border:1px solid var(--line);
  border-radius:18px;
  color:white
}

.image-caption strong{
  display:block;
  color:var(--gold2);
  margin-bottom:3px
}

.intro-list{
  margin-top:28px;
  display:grid;
  gap:12px
}

.intro-list div{
  display:flex;
  gap:12px;
  align-items:flex-start
}

.check{
  width:24px;
  height:24px;
  border-radius:50%;
  background:var(--gold);
  color:#111;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:.75rem;
  flex-shrink:0
}


/* CARDS */

.card-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px
}

.visual-card{
  background:#fff;
  border:1px solid rgba(23,21,18,.08);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 12px 40px rgba(23,21,18,.07);
  transition:.4s;
  transform-style:preserve-3d
}

.visual-card:hover{
  transform:translateY(-8px) rotateX(1deg) rotateY(-1deg);
  box-shadow:0 25px 55px rgba(23,21,18,.14)
}

.card-image{
  height:230px;
  overflow:hidden;
  position:relative
}

.card-image img{
  height:100%;
  object-fit:cover;
  transition:.5s
}

.visual-card:hover .card-image img{transform:scale(1.06)}

.card-tag{
  position:absolute;
  top:15px;
  left:15px;
  background:rgba(7,7,7,.82);
  color:var(--gold2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  font-size:.68rem;
  font-weight:700
}

.card-body{padding:24px}

.card-body p{
  font-size:.9rem;
  margin:12px 0 20px
}

.card-link{
  color:var(--gold3);
  font-size:.8rem;
  font-weight:700
}

.programmes{background:var(--ivory)}


/* QURAN */

.quran{
  background:
    linear-gradient(90deg,rgba(7,7,7,.96),rgba(7,7,7,.80)),
    url("https://images.unsplash.com/photo-1609599006353-e629aaabfeae?auto=format&fit=crop&w=2200&q=85") center/cover fixed;
  color:white
}

.quran-grid{
  display:grid;
  grid-template-columns:1fr 1.3fr;
  gap:60px;
  align-items:center
}

.quran-image{
  height:550px;
  border-radius:30px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:var(--shadow)
}

.quran-image img{
  height:100%;
  object-fit:cover
}

.quran-content p{max-width:680px}

.course-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:28px
}

.course-item{
  padding:17px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.045);
  border-radius:15px;
  transition:.3s
}

.course-item:hover{
  border-color:var(--gold);
  transform:translateY(-3px)
}

.course-item strong{
  display:block;
  color:var(--gold2);
  font-size:.92rem
}

.course-item span{
  font-size:.75rem;
  color:#aaa398
}


/* SUBJECTS */

.subjects{
  background:var(--black2);
  color:white
}

.subject-pills{
  display:flex;
  flex-wrap:wrap;
  gap:10px
}

.subject-pill{
  padding:12px 17px;
  border:1px solid var(--line);
  border-radius:999px;
  color:#ded7ca;
  background:rgba(255,255,255,.025);
  font-size:.8rem;
  transition:.25s
}

.subject-pill:hover{
  background:var(--gold);
  color:#111;
  transform:translateY(-2px)
}


/* BOARDS */

.boards{background:var(--cream)}

.board-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}

.board-card{
  min-height:210px;
  padding:28px;
  background:#fff;
  border-radius:22px;
  border:1px solid rgba(23,21,18,.08);
  position:relative;
  overflow:hidden
}

.board-card::before{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  background:rgba(201,164,92,.12);
  right:-30px;
  top:-30px
}

.board-card strong{
  display:block;
  font-family:"Playfair Display",serif;
  font-size:1.3rem;
  margin-bottom:12px
}

.board-card span{
  font-size:.78rem;
  color:var(--muted)
}


/* IB */

.ib-section{background:var(--ivory)}

.ib-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.ib-group{
  background:white;
  padding:25px;
  border-radius:20px;
  border:1px solid rgba(23,21,18,.08)
}

.ib-group h3{
  font-size:1.15rem;
  margin-bottom:14px
}

.ib-group ul{
  list-style:none;
  display:grid;
  gap:7px
}

.ib-group li{
  font-size:.78rem;
  color:var(--muted);
  padding-bottom:7px;
  border-bottom:1px solid #eee8dc
}


/* EXAMS */

.exams{
  background:var(--black);
  color:white
}

.exam-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}

.exam{
  padding:22px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.025);
  transition:.3s
}

.exam:hover{
  border-color:var(--gold);
  transform:translateY(-3px)
}

.exam strong{
  display:block;
  color:var(--gold2);
  font-size:.9rem
}

.exam span{
  display:block;
  font-size:.72rem;
  color:#a8a095;
  margin-top:5px
}

.exam-note{
  display:inline-block;
  margin-top:12px;
  font-size:.68rem;
  color:#bdb5a9
}


/* INTERNATIONAL EXAMS */

.international-exams{
  background:var(--ivory)
}

.exam-category{
  margin-bottom:55px
}

.exam-category:last-child{
  margin-bottom:0
}

.exam-category-title{
  color:var(--text);
  margin-bottom:20px;
  font-size:1.8rem
}

.exam-category-intro{
  margin-bottom:22px;
  max-width:760px
}

.international-exam-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px
}

.international-exam-card{
  background:white;
  border:1px solid rgba(23,21,18,.08);
  border-radius:22px;
  padding:28px;
  box-shadow:0 12px 35px rgba(23,21,18,.05);
  transition:.3s
}

.international-exam-card:hover{
  transform:translateY(-5px);
  box-shadow:0 20px 45px rgba(23,21,18,.1)
}

.international-exam-card h3{
  margin-bottom:10px;
  font-size:1.35rem
}

.exam-label{
  display:inline-block;
  color:var(--gold3);
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:700;
  margin-bottom:10px
}

.international-exam-card p{
  font-size:.82rem;
  margin-bottom:15px
}

.exam-components{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.exam-component{
  padding:6px 10px;
  border-radius:999px;
  background:var(--cream);
  color:#665b4d;
  font-size:.66rem;
  font-weight:600
}


/* SUPPORT */

.support{background:var(--cream)}

.support-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px
}

.support-card{
  position:relative;
  min-height:320px;
  border-radius:25px;
  overflow:hidden;
  color:white
}

.support-card img{
  height:100%;
  object-fit:cover;
  position:absolute;
  inset:0
}

.support-overlay{
  position:absolute;
  inset:0;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background:linear-gradient(transparent 25%,rgba(0,0,0,.88))
}

.support-overlay h3{color:white}

.support-overlay p{
  color:#ddd7cd;
  font-size:.82rem;
  margin-top:7px
}


/* LIBRARY */

.library{background:var(--ivory)}

.library-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px
}

.resource-card{
  background:#fff;
  border-radius:22px;
  overflow:hidden;
  border:1px solid rgba(23,21,18,.08);
  box-shadow:0 12px 35px rgba(23,21,18,.06);
  transition:.3s
}

.resource-card:hover{
  transform:translateY(-5px);
  box-shadow:0 20px 45px rgba(23,21,18,.1)
}

.resource-cover{
  height:300px;
  overflow:hidden;
  background:linear-gradient(135deg,#0a0a0a,#211b10);
  position:relative
}

.resource-cover img{
  height:100%;
  width:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  opacity:1;
  filter:saturate(.9) contrast(1.04);
  transition:transform .5s ease,filter .5s ease
}

.resource-cover::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(7,7,7,.05),rgba(7,7,7,.38));
  pointer-events:none
}

.resource-card:hover .resource-cover img{
  transform:scale(1.04);
  filter:saturate(1) contrast(1.05)
}

.resource-body{padding:22px}

.resource-meta{
  font-size:.7rem;
  color:var(--gold3);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em
}

.resource-body h3{
  margin:8px 0;
  font-size:1.3rem
}

.resource-body p{
  font-size:.8rem;
  margin-bottom:18px
}

.resource-download{
  width:100%;
}


/* ARTICLES & BLOG */

.articles{background:var(--cream)}

.article-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px
}

.article-card{
  background:#fff;
  border:1px solid rgba(23,21,18,.08);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 35px rgba(23,21,18,.06);
  transition:.35s
}

.article-card:hover{
  transform:translateY(-6px);
  box-shadow:0 22px 48px rgba(23,21,18,.12)
}

.article-top{
  min-height:150px;
  padding:26px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:linear-gradient(135deg,#0a0a0a,#241d10);
  color:white;
  position:relative
}

.article-top::after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  right:-35px;
  top:-45px;
  background:rgba(231,205,143,.13);
  filter:blur(2px)
}

.article-category{
  position:relative;
  z-index:1;
  color:var(--gold2);
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.1em;
  font-weight:700
}

.article-mark{
  position:relative;
  z-index:1;
  font-family:"Playfair Display",serif;
  font-size:2.4rem;
  color:rgba(231,205,143,.92);
  line-height:1
}

.article-body{padding:24px}

.article-body h3{
  font-size:1.25rem;
  line-height:1.25;
  margin-bottom:10px
}

.article-body p{
  font-size:.84rem;
  margin-bottom:16px
}

.article-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:#8b8173;
  font-size:.68rem;
  margin-bottom:16px
}

.article-details summary{
  list-style:none;
  cursor:pointer;
  color:var(--gold3);
  font-size:.78rem;
  font-weight:700
}

.article-details summary::-webkit-details-marker{display:none}
.article-details summary::after{content:"  +"}
.article-details[open] summary::after{content:"  −"}

.article-full{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid rgba(23,21,18,.08);
  font-size:.8rem;
  line-height:1.75
}

@media(max-width:980px){
  .article-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:720px){
  .article-grid{grid-template-columns:1fr}
}


/* GALLERY */

.gallery{background:var(--cream)}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:220px;
  gap:15px
}

.gallery-item{
  overflow:hidden;
  border-radius:20px;
  position:relative
}

.gallery-item.large{
  grid-column:span 2;
  grid-row:span 2
}

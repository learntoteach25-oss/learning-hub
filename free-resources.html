<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Learning Library | Learning Hub</title><meta name="description" content="Free illustrated stories and learning resources from Learning Hub Global Education Platform."><link rel="icon" href="assets/learning-hub-logo.png"><link rel="stylesheet" href="assets/site.css?v=20261005"><style>
:root{--lh-navy:#082d58;--lh-gold:#d4a73e;--lh-cream:#f8f3e9;--lh-line:#e3c88e;--lh-green:#153d35}.lhlib-page{background:var(--lh-cream)}.lhlib-main{box-sizing:border-box;width:min(1160px,calc(100% - 40px));margin:0 auto;padding:24px 0 70px}.lhlib-back{position:static!important;display:inline-flex!important;align-items:center;padding:9px 15px;margin:0 0 18px;border:1px solid var(--lh-gold);border-radius:999px;background:#fff;color:#65480b;font:800 11px Arial;text-decoration:none}.lhlib-hero{position:relative!important;display:block!important;overflow:hidden!important;width:100%!important;margin:0!important;padding:0!important;border:1px solid var(--lh-line);border-radius:18px;background:#fff;box-shadow:0 10px 26px rgba(50,35,10,.08);line-height:0}.lhlib-hero-img{position:static!important;display:block!important;width:100%!important;height:auto!important;max-width:100%!important;max-height:none!important;margin:0!important;padding:0!important;object-fit:contain!important}.lhlib-home{position:static!important;display:block!important;margin:0!important;padding:34px 0 0!important}.lhlib-intro{position:static!important;display:block!important;max-width:650px;margin:0 auto 20px!important;padding:0!important;text-align:center}.lhlib-kicker{display:block;color:#936400;font:900 10px Arial;letter-spacing:.17em;text-transform:uppercase}.lhlib-title{margin:7px 0 7px!important;color:var(--lh-navy)!important;font:700 29px/1.12 Georgia,serif!important}.lhlib-subtitle{margin:0!important;color:#665d52!important;font:13px/1.5 Arial!important}.lhlib-grid{position:static!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:20px!important;width:100%!important;max-width:980px!important;margin:0 auto!important;padding:0!important}.lhlib-card{position:static!important;display:block!important;overflow:hidden!important;width:auto!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;border:1px solid #dfcfb0!important;border-radius:17px!important;background:#fff!important;box-shadow:0 9px 24px rgba(52,37,13,.08)!important}.lhlib-open{position:static!important;display:flex!important;flex-direction:column!important;width:100%!important;height:100%!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important;background:#fff!important;text-align:left!important;cursor:pointer!important}.lhlib-art{position:static!important;display:block!important;width:100%!important;height:auto!important;aspect-ratio:16/9!important;margin:0!important;padding:0!important;object-fit:contain!important;object-position:center!important;background:#f1eadf!important}.lhlib-copy{position:static!important;display:flex!important;flex:1!important;flex-direction:column!important;width:auto!important;height:auto!important;margin:0!important;padding:17px 19px 19px!important;background:#fff!important;color:#17130e!important}.lhlib-card-title{position:static!important;display:block!important;margin:0!important;color:var(--lh-navy)!important;font:700 22px/1.15 Georgia,serif!important}.lhlib-desc{position:static!important;display:block!important;margin:7px 0 13px!important;color:#665b4d!important;font:12px/1.5 Arial!important}.lhlib-action{position:static!important;display:inline-flex!important;align-items:center!important;align-self:flex-start!important;margin:auto 0 0!important;padding:8px 12px!important;border-radius:999px!important;background:var(--lh-green)!important;color:#fff!important;font:800 10px Arial!important}.lhlib-collection{position:static!important;margin:28px 0 0!important;padding:26px!important;border:1px solid #dfcfb0!important;border-radius:18px!important;background:#fff!important}.lhlib-collection[hidden]{display:none!important}.lhlib-collection-back{position:static!important;display:inline-flex!important;margin:0 0 13px!important;padding:8px 11px!important;border:1px solid var(--lh-gold)!important;border-radius:999px!important;background:#fffaf0!important;color:#76520b!important;font:800 11px Arial!important;cursor:pointer!important}.lhlib-story-grid{position:static!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;margin-top:18px!important}.lhlib-story{position:static!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:14px!important;min-height:68px!important;padding:14px 16px!important;border:1px solid #e5d8c0!important;border-radius:12px!important;background:#fffdfa!important;text-decoration:none!important}.lhlib-story-name{color:var(--lh-navy);font:700 15px/1.3 Georgia,serif}.lhlib-story-go{flex:none;padding:7px 10px;border-radius:999px;background:var(--lh-green);color:#fff;font:800 10px Arial}@media(max-width:760px){.lhlib-main{width:calc(100% - 22px);padding-top:15px}.lhlib-grid,.lhlib-story-grid{grid-template-columns:1fr!important}.lhlib-home{padding-top:26px!important}.lhlib-title{font-size:25px!important}.lhlib-collection{padding:20px!important}}
</style></head><body class="lhlib-page"><header></header><main class="lhlib-main"><a class="lhlib-back" href="/?view=resources">← Back to Resources</a><section class="lhlib-hero"><img class="lhlib-hero-img" src="assets/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2001_12_45%20PM.png?v=20261005-clean" alt="Free Learning Library — Read. Practise. Grow."></section><section id="libraryHome" class="lhlib-home"><div class="lhlib-intro"><span class="lhlib-kicker">Story Collections</span><h1 class="lhlib-title">Choose a Reading Path</h1><p class="lhlib-subtitle">Select the collection that matches the reader.</p></div><div class="lhlib-grid"><article class="lhlib-card"><button class="lhlib-open" id="openKidsStories" type="button"><img class="lhlib-art" src="assets/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2012_29_38%20PM.png?v=20261005-clean" alt="Kids’ Stories collection"><span class="lhlib-copy"><span class="lhlib-card-title">Kids’ Stories</span><span class="lhlib-desc">Six illustrated stories for younger readers, built around simple themes and positive learning.</span><span class="lhlib-action">Explore Stories →</span></span></button></article><article class="lhlib-card"><button class="lhlib-open" id="openTeenStories" type="button"><img class="lhlib-art" src="assets/Teens%E2%80%99%20Stories_%20Learn%2C%20Grow%2C%20Belong.png?v=20261005-clean" alt="Teens’ Stories collection"><span class="lhlib-copy"><span class="lhlib-card-title">Teens’ Stories</span><span class="lhlib-desc">Stories exploring choices, challenges, growth and real-life learning.</span><span class="lhlib-action">Explore Stories →</span></span></button></article></div></section><section id="kidsStoriesCollection" class="lhlib-collection" hidden><button class="lhlib-collection-back" data-back type="button">← Back to collections</button><span class="lhlib-kicker">Kids’ Stories</span><h1 class="lhlib-title">Stories for Young Readers</h1><p class="lhlib-subtitle">Choose a title to read.</p><div id="kidsGrid" class="lhlib-story-grid"></div></section><section id="teenStoriesCollection" class="lhlib-collection" hidden><button class="lhlib-collection-back" data-back type="button">← Back to collections</button><span class="lhlib-kicker">Teens’ Stories</span><h1 class="lhlib-title">Stories for Teens</h1><p class="lhlib-subtitle">Choose a title to read.</p><div id="teensGrid" class="lhlib-story-grid"></div></section></main><footer></footer><script>const kids=[['Bella the Bunny Helps a Friend',"resources/kids-stories/Bella%20the%20bunny.%20Kids'%20Story.pdf"],['Daisy Learns to Be Brave',"resources/kids-stories/Dasiy%20learns%20to%20be%20brave.%20Kids'%20story.pdf"],['Hazel and the Whispering Garden',"resources/kids-stories/Hazel%20and%20the%20Whispering%20Garden.%20Kids'%20Story.pdf"],['Lily the Little Dog Shows Courage',"resources/kids-stories/Lily%20the%20little%20dog.%20Kids%3B%20story.pdf"],['Luna the Firefly Finds Her Light',"resources/kids-stories/Luna-The%20firefly%20finds%20her%20light.%20Kids'%20story.pdf"],['Milo the Kitten Learns to Share',"resources/kids-stories/Milo%20the%20kitten%20learns%20to%20share.%20Kids'%20Story.pdf"]];const teens=[['Maya the Mastermind — The Answer AI Couldn’t Give','resources/teens-stories/Maya_the_Mastermind.pdf'],['The Journey of a Slow Learner','resources/teens-stories/The_Journey_of_a_Slow_Learner.pdf']];function render(id,items){document.getElementById(id).innerHTML=items.map(([title,file])=>`<a class="lhlib-story" href="${file}" target="_blank" rel="noopener"><span class="lhlib-story-name">${title}</span><span class="lhlib-story-go">Read PDF ↗</span></a>`).join('')}render('kidsGrid',kids);render('teensGrid',teens);const home=document.getElementById('libraryHome'),kc=document.getElementById('kidsStoriesCollection'),tc=document.getElementById('teenStoriesCollection');function openCollection(el){home.hidden=true;kc.hidden=true;tc.hidden=true;el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'start'})}document.getElementById('openKidsStories').onclick=()=>openCollection(kc);document.getElementById('openTeenStories').onclick=()=>openCollection(tc);document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{kc.hidden=true;tc.hidden=true;home.hidden=false;home.scrollIntoView({behavior:'smooth',block:'start'})});</script><script src="//code.tidio.co/7aoz1jeb789oh2rtkwr2llropicgqdar.js" async></script><script src="assets/site-shell.js?v=20261005-clean-library"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Learning Library | Learning Hub</title><meta name="description" content="Free illustrated stories and learning resources from Learning Hub Global Education Platform."><link rel="icon" href="assets/learning-hub-logo.png?v=approved-20260923"><link rel="stylesheet" href="assets/site.css?v=20261002-cleanbase"><style>.library-page{background:#f8f3e9;min-height:70vh}.library-main{width:min(1180px,calc(100% - 48px));margin:auto;padding:42px 0 76px}.library-back{display:inline-flex;padding:10px 16px;margin-bottom:24px;border:1px solid #d4a73e;border-radius:999px;background:#fff;font-size:13px;font-weight:800}.library-hero{overflow:hidden;border:1px solid #e1d1b2;border-radius:22px;background:#fff;box-shadow:0 12px 34px rgba(52,37,13,.08)}.library-hero img{width:100%;height:auto;object-fit:contain}.library-intro{max-width:760px;margin:36px auto 26px;text-align:center}.library-kicker{display:block;margin-bottom:8px;color:#946600;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.library-intro h1,.collection-head h2{margin:0 0 10px;color:#102d4c;font:700 clamp(32px,4vw,46px)/1.08 Georgia,serif}.library-intro p,.collection-head p{margin:0;color:#655b4d;font-size:14px;line-height:1.6}.folder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.folder-card{overflow:hidden;background:#fff;border:1px solid #dfcfb0;border-radius:20px;box-shadow:0 12px 30px rgba(52,37,13,.08)}.folder-open{width:100%;padding:0;border:0;background:#fff;color:#17130e;text-align:left}.folder-image{width:100%;aspect-ratio:16/8.5;object-fit:cover;background:#eee5d5}.folder-copy{display:block;padding:20px 24px 23px}.folder-title{display:block;color:#102d4c;font:700 28px/1.1 Georgia,serif}.folder-desc{display:block;margin-top:8px;color:#665b4d;font-size:13px;line-height:1.45}.folder-action{display:inline-flex;margin-top:14px;padding:10px 15px;border-radius:999px;background:#153d35;color:#fff;font-size:12px;font-weight:800}.story-collection{margin-top:30px;padding:30px;background:#fff;border:1px solid #dfcfb0;border-radius:20px}.collection-back{padding:0 0 16px;border:0;background:transparent;color:#8d5d08;font-size:13px;font-weight:800}.collection-head{margin-bottom:22px}.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.story-link{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px;border:1px solid #e5d8c0;border-radius:14px;background:#fffdfa}.story-title{color:#102d4c;font:700 18px/1.25 Georgia,serif}.story-arrow{flex:0 0 auto;padding:8px 11px;border-radius:999px;background:#153d35;color:#fff;font-size:11px;font-weight:800}@media(max-width:720px){.library-main{width:calc(100% - 32px);padding-top:28px}.folder-grid,.story-grid{grid-template-columns:1fr}.story-collection{padding:22px 18px}}</style></head><body class="library-page"><header></header><main class="library-main"><a class="library-back" href="/?view=resources">← Back to Resources</a><section class="library-hero"><img src="assets/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2001_12_45%20PM.png?v=20261002-full" alt="Free Learning Library — Read, Practise, Grow"></section><section id="libraryHome"><div class="library-intro"><span class="library-kicker">Free Learning Library</span><h1>Stories to Read, Reflect &amp; Grow</h1><p>Choose an age group, then open a story to read.</p></div><div class="folder-grid"><article class="folder-card"><button class="folder-open" id="openKidsStories" type="button"><img class="folder-image" src="assets/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2012_29_38%20PM.png?v=20260924c" alt="Kids’ Stories"><span class="folder-copy"><span class="folder-title">Kids’ Stories</span><span class="folder-desc">Illustrated stories for young readers.</span><span class="folder-action">Open Folder →</span></span></button></article><article class="folder-card"><button class="folder-open" id="openTeenStories" type="button"><img class="folder-image" src="assets/Teens%E2%80%99%20Stories_%20Learn%2C%20Grow%2C%20Belong.png?v=20261002" alt="Teens’ Stories"><span class="folder-copy"><span class="folder-title">Teens’ Stories</span><span class="folder-desc">Stories about choices, challenges, growth and real-life learning.</span><span class="folder-action">Open Folder →</span></span></button></article></div></section><section id="kidsStoriesCollection" class="story-collection" hidden><div class="collection-head"><button class="collection-back" data-back type="button">← Free Learning Library</button><span class="library-kicker">Kids’ Stories</span><h2>Stories for Young Readers</h2><p>Choose a title to read.</p></div><div id="kidsGrid" class="story-grid"></div></section><section id="teenStoriesCollection" class="story-collection" hidden><div class="collection-head"><button class="collection-back" data-back type="button">← Free Learning Library</button><span class="library-kicker">Teens’ Stories</span><h2>Stories for Teens</h2><p>Choose a title to read.</p></div><div id="teensGrid" class="story-grid"></div></section></main><footer></footer><script>const kids=[['Bella the Bunny Helps a Friend',"resources/kids-stories/Bella%20the%20bunny.%20Kids'%20Story.pdf"],['Daisy Learns to Be Brave',"resources/kids-stories/Dasiy%20learns%20to%20be%20brave.%20Kids'%20story.pdf"],['Hazel and the Whispering Garden',"resources/kids-stories/Hazel%20and%20the%20Whispering%20Garden.%20Kids'%20Story.pdf"],['Lily the Little Dog Shows Courage',"resources/kids-stories/Lily%20the%20little%20dog.%20Kids%3B%20story.pdf"],['Luna the Firefly Finds Her Light',"resources/kids-stories/Luna-The%20firefly%20finds%20her%20light.%20Kids'%20story.pdf"],['Milo the Kitten Learns to Share',"resources/kids-stories/Milo%20the%20kitten%20learns%20to%20share.%20Kids'%20Story.pdf"],['Sam the Squirrel Learns to Be Patient',"resources/kids-stories/Sam%20The%20Squirrel.%20Kids'%20Story.pdf"],['The Squirrel Who Saved the Sunshine',"resources/kids-stories/The%20Squirrel%20who%20saved%20the%20sunshine.%20Kids'%20Story.pdf"],['Toby the Turtle Shows Kindness',"resources/kids-stories/Toby%20the%20Turtle%20shows%20kinndness.%20Kids'%20Story.pdf"]],teens=[['Maya the Mastermind — The Answer AI Couldn’t Give','resources/teens-stories/Maya_the_Mastermind.pdf'],['The Journey of a Slow Learner','resources/teens-stories/The_Journey_of_a_Slow_Learner.pdf']],render=(id,items)=>document.getElementById(id).innerHTML=items.map(([title,file])=>`<a class="story-link" href="${file}" target="_blank" rel="noopener"><span class="story-title">${title}</span><span class="story-arrow">Read PDF ↗</span></a>`).join('');render('kidsGrid',kids);render('teensGrid',teens);const home=document.getElementById('libraryHome'),kc=document.getElementById('kidsStoriesCollection'),tc=document.getElementById('teenStoriesCollection');function openCollection(el){home.hidden=true;kc.hidden=true;tc.hidden=true;el.hidden=false;scrollTo({top:0,behavior:'smooth'})}document.getElementById('openKidsStories').onclick=()=>openCollection(kc);document.getElementById('openTeenStories').onclick=()=>openCollection(tc);document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{kc.hidden=true;tc.hidden=true;home.hidden=false;scrollTo({top:0,behavior:'smooth'})});</script><script src="//code.tidio.co/7aoz1jeb789oh2rtkwr2llropicgqdar.js" async></script><script src="assets/site-shell.js?v=20261002-cleanbase"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Learning Library | Learning Hub</title><meta name="description" content="Free illustrated stories and learning resources from Learning Hub Global Education Platform."><link rel="icon" href="assets/learning-hub-logo.png"><link rel="stylesheet" href="assets/site.css?v=20261005-approved-resources"><style>
:root{--navy:#082d58;--gold:#d4a73e;--cream:#f8f3e9;--line:#e3c88e;--green:#153d35}.library-page{background:var(--cream);min-height:70vh}.library-main{width:min(1100px,calc(100% - 44px));margin:auto;padding:28px 0 68px}.library-back{display:inline-flex;padding:8px 14px;margin-bottom:18px;border:1px solid var(--gold);border-radius:999px;background:#fff;color:#5e450f;font:800 11px Arial;text-decoration:none}.library-hero{overflow:hidden;width:100%;padding:0!important;border:1px solid var(--line);border-radius:20px;background:#fffdf9;box-shadow:0 10px 28px rgba(52,37,13,.07);line-height:0}.library-hero img{display:block!important;width:100%!important;height:auto!important;max-width:100%!important;margin:0!important;object-fit:contain!important;object-position:center!important}.kicker{color:#946600;font:900 10px Arial;letter-spacing:.16em;text-transform:uppercase}.library-intro{text-align:center;margin:34px 0 20px}.library-intro h2,.collection-head h2{margin:6px 0 7px;color:var(--navy);font:700 28px/1.1 Georgia,serif}.library-intro p,.collection-head p{margin:0;color:#6a6258;font:13px/1.5 Arial}.library-page .folder-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;align-items:stretch!important;gap:18px!important;max-width:900px!important;margin:0 auto!important}.library-page .folder-card{display:flex!important;overflow:hidden!important;height:100%!important;background:#fff!important;border:1px solid #dfcfb0!important;border-radius:16px!important;box-shadow:0 8px 22px rgba(52,37,13,.07)!important}.library-page .folder-open{display:flex!important;flex-direction:column!important;width:100%!important;height:100%!important;padding:0!important;border:0!important;background:#fff!important;text-align:left!important;cursor:pointer!important}.library-page .folder-image-wrap{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:210px!important;overflow:hidden!important;background:#eee5d5!important}.library-page .folder-image{display:block!important;width:100%!important;height:100%!important;margin:0!important;object-fit:contain!important;object-position:center center!important;background:#eee5d5!important}.library-page .folder-copy{display:flex!important;flex:1!important;flex-direction:column!important;align-items:flex-start!important;padding:17px 20px 20px!important;background:#fff!important}.library-page .folder-title{display:block!important;color:var(--navy)!important;font:700 22px/1.1 Georgia,serif!important}.library-page .folder-desc{display:block!important;margin:7px 0 0!important;color:#665b4d!important;font:12px/1.45 Arial!important;min-height:36px!important}.library-page .folder-action{display:inline-flex!important;margin-top:auto!important;padding:8px 12px!important;border-radius:999px!important;background:var(--green)!important;color:#fff!important;font:800 10px Arial!important}.story-collection{margin-top:24px;padding:28px;background:#fff;border:1px solid #dfcfb0;border-radius:18px}.collection-back{display:inline-flex;margin-bottom:12px;padding:7px 11px;border:1px solid #e1c47f;border-radius:999px;background:#fffaf0;color:#7d5507;font:800 11px Arial;cursor:pointer}.collection-head{margin-bottom:18px}.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.story-link{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border:1px solid #e5d8c0;border-radius:12px;background:#fffdfa;text-decoration:none}.story-title{color:var(--navy);font:700 16px/1.25 Georgia,serif}.story-arrow{flex:0 0 auto;padding:7px 10px;border-radius:999px;background:var(--green);color:#fff;font:800 10px Arial}@media(max-width:760px){.library-main{width:calc(100% - 24px)}.library-page .folder-grid,.story-grid{grid-template-columns:1fr!important}.library-page .folder-image-wrap{height:auto!important;min-height:0!important}.library-page .folder-image{height:auto!important}.story-collection{padding:22px 18px}}
</style></head><body class="library-page"><header></header><main class="library-main"><a class="library-back" href="/?view=resources">← Back to Resources</a><section class="library-hero"><img src="assets/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2001_12_45%20PM.png?v=20261005-approved-resources" alt="Free Learning Library — Read. Practise. Grow."></section><section id="libraryHome"><div class="library-intro"><span class="kicker">Story Collections</span><h2>Choose a Reading Path</h2><p>Select the collection that matches the reader.</p></div><div class="folder-grid"><article class="folder-card"><button class="folder-open" id="openKidsStories" type="button"><span class="folder-image-wrap"><img class="folder-image" src="assets/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2012_29_38%20PM.png?v=20261005-approved-resources" alt="Kids’ Stories collection"></span><span class="folder-copy"><span class="folder-title">Kids’ Stories</span><span class="folder-desc">Six illustrated stories for younger readers, built around simple themes and positive learning.</span><span class="folder-action">Explore Stories →</span></span></button></article><article class="folder-card"><button class="folder-open" id="openTeenStories" type="button"><span class="folder-image-wrap"><img class="folder-image" src="assets/Teens%E2%80%99%20Stories_%20Learn%2C%20Grow%2C%20Belong.png?v=20261005-approved-resources" alt="Teens’ Stories collection"></span><span class="folder-copy"><span class="folder-title">Teens’ Stories</span><span class="folder-desc">Stories exploring choices, challenges, growth and real-life learning.</span><span class="folder-action">Explore Stories →</span></span></button></article></div></section><section id="kidsStoriesCollection" class="story-collection" hidden><div class="collection-head"><button class="collection-back" data-back type="button">← Back to collections</button><span class="kicker">Kids’ Stories</span><h2>Stories for Young Readers</h2><p>Choose a title to read.</p></div><div id="kidsGrid" class="story-grid"></div></section><section id="teenStoriesCollection" class="story-collection" hidden><div class="collection-head"><button class="collection-back" data-back type="button">← Back to collections</button><span class="kicker">Teens’ Stories</span><h2>Stories for Teens</h2><p>Choose a title to read.</p></div><div id="teensGrid" class="story-grid"></div></section></main><footer></footer><script>const kids=[['Bella the Bunny Helps a Friend',"resources/kids-stories/Bella%20the%20bunny.%20Kids'%20Story.pdf"],['Daisy Learns to Be Brave',"resources/kids-stories/Dasiy%20learns%20to%20be%20brave.%20Kids'%20story.pdf"],['Hazel and the Whispering Garden',"resources/kids-stories/Hazel%20and%20the%20Whispering%20Garden.%20Kids'%20Story.pdf"],['Lily the Little Dog Shows Courage',"resources/kids-stories/Lily%20the%20little%20dog.%20Kids%3B%20story.pdf"],['Luna the Firefly Finds Her Light',"resources/kids-stories/Luna-The%20firefly%20finds%20her%20light.%20Kids'%20story.pdf"],['Milo the Kitten Learns to Share',"resources/kids-stories/Milo%20the%20kitten%20learns%20to%20share.%20Kids'%20Story.pdf"]];const teens=[['Maya the Mastermind — The Answer AI Couldn’t Give','resources/teens-stories/Maya_the_Mastermind.pdf'],['The Journey of a Slow Learner','resources/teens-stories/The_Journey_of_a_Slow_Learner.pdf']];function render(id,items){document.getElementById(id).innerHTML=items.map(([title,file])=>`<a class="story-link" href="${file}" target="_blank" rel="noopener"><span class="story-title">${title}</span><span class="story-arrow">Read PDF ↗</span></a>`).join('')}render('kidsGrid',kids);render('teensGrid',teens);const home=document.getElementById('libraryHome'),kc=document.getElementById('kidsStoriesCollection'),tc=document.getElementById('teenStoriesCollection');function openCollection(el){home.hidden=true;kc.hidden=true;tc.hidden=true;el.hidden=false;el.scrollIntoView({behavior:'smooth',block:'start'})}document.getElementById('openKidsStories').onclick=()=>openCollection(kc);document.getElementById('openTeenStories').onclick=()=>openCollection(tc);document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{kc.hidden=true;tc.hidden=true;home.hidden=false;home.scrollIntoView({behavior:'smooth',block:'start'})});</script><script src="//code.tidio.co/7aoz1jeb789oh2rtkwr2llropicgqdar.js" async></script><script src="assets/site-shell.js?v=20261005-approved-resources"></script></body></html>

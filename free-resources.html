<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Resources | Learning Hub Global Education Platform</title>
<style>
:root{--ink:#15130f;--cream:#f7f2e8;--gold:#c99737;--green:#153d35;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
header{background:#050505;color:#fff;padding:14px max(24px,6%);display:flex;align-items:center;min-height:86px;position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(201,151,55,.35)}
.brandmark{display:none}.site-brand{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none}.site-brand img{width:72px;height:72px;object-fit:contain;display:block;flex:0 0 72px}.site-brand strong{display:block;font:700 17px/1.1 Georgia,serif;letter-spacing:.04em}.site-brand small{display:block;color:#d7b45d;font-size:11px;letter-spacing:.13em;margin-top:5px}
header strong{font-size:18px}header small{display:block;color:#e5c36f;letter-spacing:.08em;margin-top:4px}
main{max-width:1180px;margin:auto;padding:64px 24px 90px}
.kicker{color:#946600;font-weight:700;letter-spacing:.16em;font-size:12px}h1{font:700 52px/1.05 Georgia,serif;margin:10px 0 14px}
.intro{max-width:720px;font-size:17px;line-height:1.65;color:#554c41}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:32px 0}.tools input,.tools select{padding:13px 15px;border:1px solid #d9cfbf;border-radius:10px;background:#fff;font-size:15px}
.tools input{min-width:300px;flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid #e4dacb;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(42,32,18,.05)}
.card .type{font-size:11px;color:#946600;font-weight:700;letter-spacing:.12em}.card h2{font:700 23px/1.2 Georgia,serif;margin:10px 0}.card p{color:#665b4d;line-height:1.5}
.card a{display:inline-block;margin-top:8px;padding:11px 16px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-weight:700}
.empty{padding:36px;background:#fff;border-radius:18px;border:1px solid #e4dacb;color:#665b4d}
.back{color:#fff;text-decoration:none;margin-left:auto}
@media(max-width:800px){h1{font-size:38px}.grid{grid-template-columns:1fr}.tools input{min-width:100%}}
.story-collection{margin:34px 0;padding:34px 32px;border:1px solid #dfd1b8;border-radius:22px;background:#fffaf0;box-shadow:0 14px 42px rgba(42,32,18,.06);overflow:hidden}
.story-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:22px}.story-head h2{font:700 34px/1.1 Georgia,serif;margin:6px 0}.story-head p{max-width:650px;margin:0;color:#655848;line-height:1.55}.story-badge{white-space:nowrap;padding:9px 13px;border:1px solid #d6bd84;border-radius:999px;color:#76520b;font-size:12px;font-weight:700;letter-spacing:.08em}
.story-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.story-card{display:flex;flex-direction:column;min-width:0;padding:0 0 20px;border-radius:16px;background:#fff;border:1px solid #e4d8c3;overflow:hidden;box-shadow:0 8px 24px rgba(42,32,18,.05);transition:transform .2s ease,box-shadow .2s ease}.story-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(42,32,18,.11)}.story-cover{display:block;width:100%;height:310px;border:0;border-radius:14px 14px 0 0;background:#f4efe5;overflow:hidden;box-shadow:none;position:relative}.story-cover iframe{position:absolute;left:0;top:0;width:calc(100% + 22px);height:100%;border:0;pointer-events:none;display:block;overflow:hidden;transform-origin:top left}.story-card .story-no{font:700 12px Georgia,serif;color:#a06e10;letter-spacing:.12em}.story-card h3{font:700 22px/1.2 Georgia,serif;margin:18px 20px 10px;min-height:53px}.story-card p{margin:0 0 18px;color:#665b4d;line-height:1.5}.story-card>a:last-child{margin:6px 20px 0;display:inline-block;align-self:flex-start;padding:11px 15px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-weight:700}.upgrade-note{margin:42px 0 0;padding:20px 22px;border:1px solid #e0d5c4;border-radius:16px;background:#fff;color:#665b4d;text-align:center}.library-title{font:700 30px/1.1 Georgia,serif;margin:46px 0 8px}.library-note{color:#665b4d;margin:0 0 20px}
@media(max-width:900px){.story-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.story-collection{padding:20px}.story-head{align-items:flex-start;flex-direction:column}.story-grid{grid-template-columns:1fr}}
.folder-card{max-width:540px;margin-top:34px;background:#fff;border:1px solid #e2d5bf;border-radius:22px;overflow:hidden;box-shadow:0 14px 38px rgba(42,32,18,.09)}
.folder-open{display:block;width:100%;padding:0;border:0;background:#fff;text-align:left;cursor:pointer;color:inherit}
.folder-open img{display:block;width:100%;height:360px;object-fit:cover;object-position:center}
.folder-copy{display:block;padding:22px 24px 24px}.folder-title{display:block;font:700 30px/1.1 Georgia,serif}.folder-desc{display:block;margin-top:8px;color:#665b4d;font-size:16px;line-height:1.45}.folder-meta{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px;color:#76520b;font-weight:700}.folder-meta b{background:var(--green);color:#fff;padding:11px 16px;border-radius:999px}
.folder-card:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(42,32,18,.13)}.folder-card{transition:.2s ease}
.collection-back{border:0;background:transparent;padding:0 0 14px;color:#76520b;font-weight:700;cursor:pointer;font-size:14px}
@media(max-width:650px){.folder-open img{height:300px}.folder-meta{align-items:flex-start;flex-direction:column}}
.library-hero{position:relative;padding:38px 42px;margin:-10px 0 34px;border:1px solid #e2d5bf;border-radius:24px;background:linear-gradient(135deg,#fffdf8 0%,#f3e7cd 100%);overflow:hidden}
.library-hero:after{content:"✦";position:absolute;right:42px;top:24px;font:700 82px Georgia,serif;color:rgba(201,151,55,.16)}
.library-hero h1{margin:8px 0 8px;font-size:54px}.hero-quote{margin:0 0 14px;font:italic 21px/1.45 Georgia,serif;color:#76520b}.library-hero .intro{margin:0;max-width:760px}
.folder-meta{justify-content:flex-end}
@media(max-width:650px){.library-hero{padding:28px 22px}.library-hero h1{font-size:40px}.hero-quote{font-size:18px}}
</style><style id="free-library-polish">
header{min-height:100px;padding:0 max(34px,4%);gap:24px}.site-brand img{width:150px;height:92px;flex:0 0 150px}.site-brand span{display:none}.back{display:none}
.library-back{display:inline-flex;align-items:center;margin:0 0 20px;padding:12px 18px;border:1px solid #d9b76b;border-radius:999px;color:#17130d;text-decoration:none;font-weight:700;background:#fffaf1}
.library-hero{display:block;padding:0!important;min-height:0;background:#fffdf8!important}.library-hero:after{display:none}.hero-copy{display:none}.hero-photo{width:100%;overflow:hidden}.hero-photo img{display:block;width:100%;height:auto;object-fit:cover}
.folder-card{max-width:none;width:100%;margin-top:38px}.folder-open{display:grid;grid-template-columns:1.05fr .95fr;min-height:310px}.folder-open>img{grid-column:2;grid-row:1;width:100%;height:100%;min-height:310px;object-fit:cover}.folder-copy{grid-column:1;grid-row:1;padding:42px 46px;display:flex;flex-direction:column;justify-content:center}.folder-title{font-size:38px}.folder-desc{font-size:17px}.folder-meta{justify-content:flex-start}
@media(max-width:760px){header{min-height:82px}.site-brand img{width:118px;height:72px;flex-basis:118px}.folder-open{grid-template-columns:1fr}.hero-photo{min-height:0}.hero-photo img{min-height:0}.folder-open>img{grid-column:1;grid-row:1;min-height:250px;height:250px}.folder-copy{grid-column:1;grid-row:2;padding:28px 24px}.folder-title{font-size:31px}}
</style><style id="story-grid-presentation-fix">
.story-collection{background:#fffaf0!important;color:var(--ink)!important}
.story-grid{align-items:stretch}
.story-card{background:#fff!important;color:var(--ink)!important;min-height:0}
.story-cover{height:310px;background:#f4efe5}
.story-card h3{color:var(--ink)!important;background:#fff!important;margin:18px 20px 12px;min-height:54px}
.story-card>a:last-child{margin-top:auto}
</style>
</head>
<body><header><a class="site-brand" href="./" aria-label="Learning Hub home"><img src="assets/learning-hub-logo.png" alt="Learning Hub logo" onerror="this.style.display='none'"><span><strong>LEARNING HUB</strong><small>GLOBAL EDUCATION PLATFORM</small></span></a><a class="back" href="./">← Website</a></header>
<main><a class="library-back" href="./">← Back to Website</a>
<section class="library-hero" aria-label="Free Learning Library — Read. Practise. Grow."><div class="hero-photo"><img src="assets/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2001_12_45%20PM.png?v=20260924d" alt="Free Learning Library — Read. Practise. Grow."></div></section>
<section id="libraryHome" aria-label="Free resource folders"><article class="folder-card"><button class="folder-open" id="openKidsStories" type="button" aria-controls="kidsStoriesCollection" aria-expanded="false"><img src="assets/ChatGPT%20Image%20Sep%2024%2C%202026%2C%2012_29_38%20PM.png?v=20260924c" alt="Kids' Stories"><span class="folder-copy"><span class="folder-title">Kids’ Stories</span><span class="folder-desc">Fun and meaningful illustrated stories for young readers.</span><span class="folder-meta"><b>Explore Folder →</b></span></span></button></article></section>
<section id="kidsStoriesCollection" class="story-collection" aria-labelledby="kidsStoriesTitle" hidden><div class="story-head"><div><button id="backToLibrary" class="collection-back" type="button">← Free Resources</button><div class="kicker">KIDS’ STORIES</div><h2 id="kidsStoriesTitle">Stories for Young Readers</h2><p>Choose a story and download the PDF free.</p></div></div><div id="storyGrid" class="story-grid"></div></section>
</main>
<script>
const resources=[{"title":"Maya the Mastermind — The Answer AI Couldn't Give","category":"Kids' Stories","description":"An illustrated story about AI literacy, source checking and independent thinking.","file":"resources/kids-stories/Maya_the_Mastermind.pdf"},{"title":"The Journey of a Slow Learner","category":"Kids' Stories","description":"An illustrated story about learning at your own pace, observation, confidence and discovering personal strengths.","file":"resources/kids-stories/The_Journey_of_a_Slow_Learner.pdf"},{"title":"Bella the Bunny Helps a Friend","category":"Kids' Stories","description":"A gentle illustrated story about helping others, with vocabulary, reflection questions and a creative activity.","file":"resources/kids-stories/Bella%20the%20bunny.%20Kids'%20Story.pdf"},{"title":"Daisy Learns to Be Brave","category":"Kids' Stories","description":"An illustrated early-learning story that explores courage and confidence through a child-friendly narrative.","file":"resources/kids-stories/Dasiy%20learns%20to%20be%20brave.%20Kids'%20story.pdf"},{"title":"Hazel and the Whispering Garden","category":"Kids' Stories","description":"A colourful children's story designed for enjoyable reading, discussion and vocabulary development.","file":"resources/kids-stories/Hazel%20and%20the%20Whispering%20Garden.%20Kids'%20Story.pdf"},{"title":"Lily the Little Dog Shows Courage","category":"Kids' Stories","description":"A short illustrated story encouraging courage, comprehension and thoughtful discussion.","file":"resources/kids-stories/Lily%20the%20little%20dog.%20Kids%3B%20story.pdf"},{"title":"Luna the Firefly Finds Her Light","category":"Kids' Stories","description":"An illustrated story about confidence and discovering personal strengths.","file":"resources/kids-stories/Luna-The%20firefly%20finds%20her%20light.%20Kids'%20story.pdf"},{"title":"Milo the Kitten Learns to Share","category":"Kids' Stories","description":"A child-friendly illustrated story about sharing, kindness and positive social behaviour.","file":"resources/kids-stories/Milo%20the%20kitten%20learns%20to%20share.%20Kids'%20Story.pdf"},{"title":"Sam the Squirrel Learns to Be Patient","category":"Kids' Stories","description":"A short illustrated story supporting reading comprehension and the value of patience.","file":"resources/kids-stories/Sam%20The%20Squirrel.%20Kids'%20Story.pdf"},{"title":"The Squirrel Who Saved the Sunshine","category":"Kids' Stories","description":"An imaginative illustrated reading resource for young learners with opportunities for discussion.","file":"resources/kids-stories/The%20Squirrel%20who%20saved%20the%20sunshine.%20Kids'%20Story.pdf"},{"title":"Toby the Turtle Shows Kindness","category":"Kids' Stories","description":"An illustrated story that introduces kindness through accessible reading and reflection.","file":"resources/kids-stories/Toby%20the%20Turtle%20shows%20kinndness.%20Kids'%20Story.pdf"},{"title":"IB English Literary Analysis Practice","category":"IB","description":"Guided literary-analysis practice for authorial choices, evidence and structured responses.","file":"IB_English_SL_Literary_Analysis_Practice_Activities.pdf"},{"title":"Grade 5 Subtraction — Italian & English","category":"Mathematics","description":"Bilingual subtraction practice supporting mathematical vocabulary and fluency.","file":"Grade_5_Subtraction_Bilingual_Italian_English_Worksheet.pdf"}];
const storyGrid=document.getElementById('storyGrid');const stories=resources.filter(r=>r.category==="Kids' Stories");storyGrid.innerHTML=stories.map((r,i)=>'<article class="story-card"><a class="story-cover" href="'+r.file+'" target="_blank" aria-label="Open '+r.title+'"><iframe src="'+r.file+'#page=1&toolbar=0&navpanes=0&scrollbar=0&view=FitH" title="'+r.title+' title artwork"></iframe></a><h3>'+r.title+'</h3><a href="'+r.file+'" download>Download Free PDF ↓</a></article>').join('');
const libraryHome=document.getElementById('libraryHome');const kidsCollection=document.getElementById('kidsStoriesCollection');document.getElementById('openKidsStories').addEventListener('click',()=>{libraryHome.hidden=true;kidsCollection.hidden=false;document.getElementById('openKidsStories').setAttribute('aria-expanded','true');window.scrollTo({top:0,behavior:'smooth'});});document.getElementById('backToLibrary').addEventListener('click',()=>{kidsCollection.hidden=true;libraryHome.hidden=false;document.getElementById('openKidsStories').setAttribute('aria-expanded','false');window.scrollTo({top:0,behavior:'smooth'});});
</script></body></html>

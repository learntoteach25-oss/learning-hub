<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Learning Hub</title>
<meta http-equiv="refresh" content="0;url=/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070707;color:#f4eee2;font-family:Arial,sans-serif;text-align:center}
a{color:#f0d58e}
</style>

<body>
<div>
<h1>Learning Hub</h1>
<p>Taking you to the requested Learning Hub page…</p>
<p><a href="/">Continue to Learning Hub</a></p>
</div>
<script>
(function(){
  var path=window.location.pathname.toLowerCase();
  if(path.endsWith('/billing.html')){
    window.location.replace('/#billing');
    return;
  }
  if(path.endsWith('/policies.html')){
    window.location.replace('/#policies');
    return;
  }
  window.location.replace('/');
})();
</script>
</body>
</html>

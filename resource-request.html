<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a Learning Resource | Learning Hub</title><link rel="stylesheet" href="assets/site.css?v=20261005-resource-order"><style>.page{background:#f8f2e8}.wrap{width:min(900px,calc(100% - 34px));margin:auto;padding:30px 0 70px}.panel{background:#fff;border:1px solid #e0c98f;border-radius:22px;padding:30px;box-shadow:0 12px 30px #49320d12}.panel h1{margin:0 0 8px;color:#082d58;font:700 38px Georgia}.sub{color:#665e53;font:13px/1.55 Arial}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:24px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;font:800 10px Arial}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbc79d;border-radius:10px;background:#fff;font:13px Arial}.send{margin-top:16px;border:0;border-radius:999px;padding:13px 18px;background:linear-gradient(135deg,#f0cf72,#d3a238);font:900 11px Arial;cursor:pointer}.status{font:12px Arial;color:#10493f;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body class="page"><header></header><main class="wrap"><section class="panel"><h1>Request a Learning Resource</h1><p class="sub">Tell us what you need, then continue to the approved Learning Hub billing pathway to place the order.</p><div class="grid"><div class="field"><label>RESOURCE TYPE</label><select id="type"><option>Custom Resource</option><option>Subject Worksheet</option><option>Revision Pack</option><option>Study Guide</option><option>International Curriculum Resource</option><option>English Resource</option><option>Other</option></select></div><div class="field"><label>SUBJECT</label><input id="subject" placeholder="e.g. English, Psychology, Mathematics"></div><div class="field"><label>CURRICULUM / BOARD</label><input id="board" placeholder="e.g. IB, Cambridge, Edexcel"></div><div class="field"><label>GRADE / LEVEL</label><input id="level" placeholder="e.g. Grade 6, IGCSE, IB SL"></div><div class="field full"><label>TOPIC / RESOURCE REQUIREMENTS</label><textarea id="requirements" rows="4" placeholder="Describe what the learner needs, learning goal, number of pages or activities, etc."></textarea></div><div class="field"><label>PREFERRED FORMAT</label><select id="format"><option>PDF</option><option>Printable Worksheet</option><option>Study Pack</option><option>Digital Activity</option><option>Not sure</option></select></div><div class="field"><label>DEADLINE (optional)</label><input id="deadline" type="date"></div><div class="field"><label>NAME</label><input id="name"></div><div class="field"><label>EMAIL</label><input id="email" type="email"></div><div class="field"><label>WHATSAPP / CONTACT</label><input id="phone" type="tel"></div></div><button id="send" class="send" type="button">Continue to Billing →</button><div id="status" class="status"></div></section></main><footer></footer><script>const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);if(q.get('type'))$('type').value=q.get('type');$('send').onclick=()=>{const name=$('name').value.trim(),email=$('email').value.trim(),requirements=$('requirements').value.trim(),status=$('status');if(!name||!email||!requirements){status.textContent='Please enter your name, email and resource requirements.';return}const p=new URLSearchParams({mode:'resource',resourceType:$('type').value,subject:$('subject').value.trim(),board:$('board').value.trim(),level:$('level').value.trim(),requirements,format:$('format').value,deadline:$('deadline').value,name,email,phone:$('phone').value.trim()});location.href='/billing?'+p.toString()};</script><script src="//code.tidio.co/7aoz1jeb789oh2rtkwr2llropicgqdar.js" async></script><script src="assets/site-shell.js?v=20261005-resource-order"></script></body></html>

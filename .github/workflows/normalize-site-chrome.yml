name: Normalize approved site chrome
on:
  push:
    branches: [main]
    paths: ['.github/workflows/normalize-site-chrome.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one canonical header and footer without touching page bodies
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets=['index.html','about.html','policies.html','billing.html','free-resources.html','ownership.html','404.html']
          header='''<header class="top"><div class="shell brandrow"><a class="site-logo" href="index.html" aria-label="Learning Hub home"><img src="assets/learning-hub-logo.png?v=approved-20260923" alt="Learning Hub — Global Education Platform"></a><nav class="nav"><a href="index.html#learningAreas">Programmes</a><a href="index.html#quran">Quran &amp; Islamic Studies</a><a href="index.html#boards">International Boards</a><a href="index.html#exams">Exams</a><a href="index.html#support">Learning Support</a><a href="index.html#resources">Resources</a><a href="index.html#teacher">Teach with Us</a><a href="index.html#contact">Contact</a><a href="about.html">About Us</a><a href="policies.html">Policies</a><a class="book" href="billing.html">Book Now</a></nav></div></header>'''
          footer='''<footer class="footer"><div class="shell"><div class="footer-grid"><div class="footer-brand"><img class="footer-logo" src="assets/learning-hub-logo.png?v=approved-20260923" alt="Learning Hub — Global Education Platform"></div><div><h3>Learning</h3><a href="index.html#learningAreas">Programmes</a><a href="index.html#quran">Quran &amp; Islamic Studies</a><a href="index.html#boards">International Boards</a><a href="index.html#exams">International Exams</a><a href="index.html#support">Learning Support</a></div><div><h3>Resources</h3><a href="free-resources.html">Free Learning Library</a><a href="index.html#resources">Premium Digital Resources</a><a href="index.html#feedback">Feedback &amp; Reviews</a><a href="index.html#teacher">Teach with Us</a></div><div><h3>Contact &amp; Legal</h3><a href="index.html#contact">Contact &amp; Enquire</a><a href="index.html#support-form">Support / Complaints</a><span class="footer-address">Karachi, Pakistan – 75300</span><div class="footer-rule"></div><a href="policies.html#terms">Terms &amp; Conditions</a><a href="policies.html#refund">Refund, Cancellation &amp; Service Delivery</a><a href="policies.html#privacy">Privacy Policy</a><a class="whatsapp" href="https://wa.me/923053750105" target="_blank" rel="noopener"><span class="wa-mark">WA</span><span><strong>Chat on WhatsApp</strong><small>Quick enquiries &amp; support</small></span></a></div></div><div class="copyright"><strong>Learning Hub – Global Education Platform</strong><span>Operated by Learning Hub Global Educational Services (SMC-Private) Limited</span><span>© 2026. All rights reserved.</span></div></div></footer>'''
          css='''<style id="canonical-site-chrome">
          .top{position:sticky!important;top:0!important;z-index:1000!important;background:#050505!important;border:0!important;border-bottom:1px solid rgba(201,164,92,.28)!important}
          .top .brandrow{width:min(1240px,calc(100% - 40px))!important;margin:auto!important;min-height:96px!important;display:grid!important;grid-template-columns:170px 1fr!important;align-items:center!important;gap:22px!important;padding:0!important}
          .top .site-logo{display:flex!important;align-items:center!important;width:170px!important;height:94px!important}
          .top .site-logo img{display:block!important;width:160px!important;height:90px!important;max-width:160px!important;max-height:90px!important;object-fit:contain!important;object-position:left center!important;margin:0!important}
          .top .nav{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:20px!important;min-width:0!important;border-top:1px solid rgba(217,173,76,.24)!important;padding-top:8px!important;margin:0!important;white-space:nowrap!important}
          .top .nav a{display:inline-block!important;color:#fff!important;text-decoration:none!important;font:700 12px/1.2 Arial,sans-serif!important;padding:7px 0!important;background:none!important;border:0!important}
          .top .nav .book{margin-left:auto!important;background:linear-gradient(135deg,#f1d27e,#c99d43)!important;color:#111!important;padding:13px 22px!important;border-radius:13px!important}
          .footer{background:#050505!important;color:#fff!important;padding:54px 0 26px!important;border-top:1px solid rgba(201,164,92,.28)!important;text-align:left!important;font-family:Arial,Helvetica,sans-serif!important}
          .footer>.shell{width:min(1240px,calc(100% - 40px))!important;margin:auto!important}
          .footer-grid{display:grid!important;grid-template-columns:1.15fr 1fr 1fr 1.2fr!important;gap:42px!important;align-items:start!important}
          .footer-brand{min-height:150px!important;display:flex!important;align-items:flex-start!important}
          .footer-logo{display:block!important;width:250px!important;height:145px!important;max-width:100%!important;object-fit:contain!important;object-position:left top!important}
          .footer h3{margin:0 0 14px!important;color:#f0d58e!important;font:700 20px/1.2 Georgia,serif!important}
          .footer a,.footer-address{display:block!important;color:#fff!important;text-decoration:none!important;font:400 14px/1.45 Arial,sans-serif!important;margin:0 0 10px!important}
          .footer-rule{height:1px!important;background:#2b2721!important;margin:15px 0!important}
          .footer .whatsapp{display:flex!important;align-items:center!important;gap:10px!important;width:max-content!important;max-width:100%!important;margin-top:18px!important;padding:10px 14px!important;border:1px solid #d9aa49!important;border-radius:12px!important;background:#fffaf0!important;color:#17130d!important}
          .footer .wa-mark{display:grid!important;place-items:center!important;width:34px!important;height:34px!important;border-radius:50%!important;background:#d9aa49!important;color:#111!important;font-size:10px!important;font-weight:800!important;flex:0 0 34px!important}
          .footer .whatsapp strong{display:block!important;color:#17130d!important;font-size:13px!important}.footer .whatsapp small{display:block!important;color:#6e5b43!important;font-size:10px!important;margin-top:3px!important}
          .copyright{border-top:1px solid #29251f!important;margin-top:36px!important;padding-top:20px!important;text-align:center!important;color:#ddd!important}.copyright strong,.copyright span{display:block!important;font:400 13px/1.5 Arial,sans-serif!important}.copyright strong{font-weight:700!important;color:#fff!important;margin-bottom:5px!important}
          @media(max-width:1050px){.top .brandrow{grid-template-columns:150px 1fr!important}.top .site-logo{width:150px!important}.top .site-logo img{width:145px!important}.top .nav{gap:12px!important}.top .nav a{font-size:11px!important}.footer-grid{grid-template-columns:1fr 1fr!important}}
          @media(max-width:760px){.top .brandrow{min-height:76px!important;grid-template-columns:1fr!important}.top .site-logo{height:74px!important;width:150px!important}.top .site-logo img{height:68px!important;width:145px!important}.top .nav{display:none!important}.footer-grid{grid-template-columns:1fr!important;gap:28px!important}.footer-brand{min-height:auto!important}.footer-logo{height:110px!important;width:210px!important}}
          </style>'''

          for name in targets:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              # Replace exactly one visible site header/footer; body content between them is untouched.
              s,n1=re.subn(r'<header\b[^>]*>.*?</header>',header,s,count=1,flags=re.S|re.I)
              s,n2=re.subn(r'<footer\b[^>]*>.*?</footer>',footer,s,count=1,flags=re.S|re.I)
              if not n1 or not n2:
                  print('SKIP missing chrome:',name,n1,n2); continue
              # Remove prior canonical block only, then append authoritative chrome last in head.
              s=re.sub(r'<style id="canonical-site-chrome">.*?</style>','',s,flags=re.S|re.I)
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
              print('normalized',name)
          PY
      - name: Commit normalized chrome and remove one-time workflow
        run: |
          rm -f .github/workflows/normalize-site-chrome.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Normalize approved header and footer across all pages"
          git push
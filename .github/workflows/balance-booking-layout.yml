name: Balance booking layout
on:
  push:
    paths:
      - '.github/workflows/balance-booking-layout.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Balance plan image and form spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          css = """<style id="learning-hub-booking-balance">
          .lh-co-hero{padding:16px 0 6px!important}
          .lh-plan-image-picker{margin:0 0 18px!important}
          .lh-co-card{padding:20px!important}
          .lh-hidden{display:none!important}
          </style>"""
          s = s.replace('</body>', css + '</body>')
          p.write_text(s)
          PY
      - name: Commit changes and remove helper
        run: |
          git config user.name "Learning Hub Updates"
          git config user.email "updates@learninghubtutoring.com"
          git rm .github/workflows/balance-booking-layout.yml
          git add index.html
          git commit -m "Balance booking image and form spacing"
          git push

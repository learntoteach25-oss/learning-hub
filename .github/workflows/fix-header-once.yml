name: Fix sitewide header and footer once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-header-once.yml']
permissions:
  contents: write
jobs:
  fix-site-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one authoritative header and footer to HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          index=(root/'index.html').read_text(encoding='utf-8')
          hm=re.search(r'(<header class="top">.*?</header>)',index,re.S)
          fm=re.search(r'(<footer class="footer">.*?</footer>)',index,re.S)
          if not hm or not fm: raise SystemExit('Master header/footer not found')
          header,footer=hm.group(1),fm.group(1)
          css='''<style id="sitewide-chrome-authoritative">
          .top{position:sticky!important;top:0!important;z-index:50!important;background:#050505!important;border-top:0!important;border-bottom:1px solid rgba(201,164,92,.25)!important}
          .top .brandrow{width:min(1240px,calc(100% - 32px))!important;margin:0 auto!important;min-height:94px!important;height:94px!important;padding:0!important;display:grid!important;grid-template-columns:180px 1fr auto!important;grid-template-rows:54px 40px!important;column-gap:16px!important;align-items:center!important}
          .top .brandrow>img{grid-column:1!important;grid-row:1/3!important;width:150px!important;height:88px!important;max-width:150px!important;max-height:88px!important;object-fit:contain!important;object-position:left center!important;margin:0!important;padding:0!important;align-self:center!important;justify-self:start!important}
          .top .brandrow>.brand{display:none!important}
          .top .nav{grid-column:2/4!important;grid-row:2!important;width:100%!important;margin:0!important;padding:6px 0 0!important;border-top:1px solid rgba(217,173,76,.22)!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:20px!important;white-space:nowrap!important}
          .top .nav button,.top .nav a{border:0!important;background:none;color:#fff!important;font-weight:700!important;font-size:12px!important;line-height:1!important;cursor:pointer!important;padding:7px 0!important;white-space:nowrap!important;text-decoration:none!important}
          .top .nav .book{margin-left:auto!important;background:linear-gradient(135deg,#f1d27e,#c99d43)!important;color:#111!important;padding:10px 20px!important;border-radius:12px!important;min-width:100px!important;text-align:center!important}
          .footer{background:#050505!important;color:#fff!important;padding:54px 0 22px!important;border-top:1px solid rgba(201,164,92,.28)!important}
          .footer>.shell{width:min(1240px,calc(100% - 32px))!important;margin:auto!important}.footer .footer-grid{display:grid!important;grid-template-columns:1.25fr 1fr 1fr 1.15fr!important;gap:48px!important;align-items:start!important}.footer .footer-grid>div{min-width:0!important;text-align:left!important}.footer .footer-brand-lockup{display:flex!important;align-items:flex-start!important;justify-content:flex-start!important;padding-top:18px!important}.footer .footer-brand-lockup .logo{width:auto!important;height:132px!important;max-width:100%!important;object-fit:contain!important;object-position:left top!important;margin:0!important}.footer h3{font:700 18px Georgia,serif!important;color:#f0d58e!important;margin:0 0 14px!important;line-height:1.2!important}.footer a,.footer button{display:block!important;color:#ddd!important;margin:0 0 8px!important;font-size:14px!important;line-height:1.45!important;text-align:left!important;text-decoration:none!important}.footer-contact-group{margin:0 0 14px!important}.footer-contact-group small{display:block!important;margin:4px 0 0!important;font-size:14px!important;line-height:1.45!important;color:#aaa!important}.footer-legal-links{border-top:1px solid #29251f!important;padding-top:12px!important}.footer-contact-actions{margin-top:12px!important}.footer .copyright{text-align:center!important;border-top:1px solid #29251f!important;margin-top:36px!important;padding-top:20px!important;color:#aaa!important}
          @media(max-width:980px){.top .brandrow{width:calc(100% - 24px)!important;height:74px!important;min-height:74px!important;display:flex!important}.top .brandrow>img{width:125px!important;height:68px!important;max-width:125px!important}.top .nav{display:none!important}.footer .footer-grid{grid-template-columns:1fr 1fr!important;gap:34px 42px!important}.footer .footer-brand-lockup{padding-top:0!important}}
          @media(max-width:640px){.footer .footer-grid{grid-template-columns:1fr!important;gap:28px!important}.footer .footer-brand-lockup .logo{height:110px!important}}
          </style>'''
          for p in root.glob('*.html'):
              if p.name=='index.html': continue
              s=p.read_text(encoding='utf-8')
              if '<header' not in s or '<footer' not in s: continue
              s=re.sub(r'<header\b.*?</header>',header,s,count=1,flags=re.S|re.I)
              s=re.sub(r'<footer\b.*?</footer>',footer,s,count=1,flags=re.S|re.I)
              s=re.sub(r'<style id="sitewide-chrome-authoritative">.*?</style>','',s,flags=re.S)
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit sitewide chrome fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Standardize header and footer across website pages"
          git push
# Re-run approved homepage chrome sync across subpages — 2026-10-01

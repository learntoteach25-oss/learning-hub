name: Apply approved sitewide website corrections
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-header-once.yml']
permissions:
  contents: write
jobs:
  approved-site-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only approved website corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          ip=root/'index.html'
          index=ip.read_text(encoding='utf-8')

          # 1) Add ONLY About Us to the existing homepage navigation, immediately before Policies.
          if '>About Us<' not in index:
              index=index.replace('<a href="policies.html">Policies</a>', '<a href="#about">About Us</a><a href="policies.html">Policies</a>', 1)

          # 2) Make the existing About/company section directly accessible and keep Ownership inside it.
          # If an about-like section already exists, give it the stable id. Otherwise add a compact company section before Contact.
          if 'id="about"' not in index:
              about_match=re.search(r'<section([^>]*)(?:class="[^"]*(?:about|company)[^"]*"[^>]*)>', index, re.I)
              if about_match:
                  tag=about_match.group(0)
                  index=index.replace(tag, tag[:-1]+' id="about">', 1)
              else:
                  ownership='''<section id="about" style="padding:56px 0;background:#fbf8f1"><div class="shell"><div class="section-title"><div class="eyebrow" style="color:#9a6f20">About Learning Hub</div><h2>Learning Hub – Global Education Platform</h2></div><div style="max-width:900px;margin:0 auto;background:#fff;border:1px solid #e5d8bf;border-radius:20px;padding:26px"><p>Learning Hub – Global Education Platform is operated by <strong>Learning Hub Global Educational Services (SMC-Private) Limited</strong>, a company incorporated in Pakistan. Our platform brings together academic support, learning resources, and global education opportunities to help learners achieve their goals.</p><h3 style="font-family:Georgia,serif;margin-top:24px">Ownership Statement</h3><p><strong>Legal Entity:</strong> Learning Hub Global Educational Services (SMC-Private) Limited<br><strong>Company Unique Identification Number (CUIN):</strong> 0358546<br><strong>Registered Office:</strong> Sindh, Pakistan<br><strong>Website:</strong> learninghubtutoring.com</p></div></div></section>'''
                  marker='<div class="contact-wrap"'
                  if marker in index:
                      index=index.replace(marker, ownership+marker, 1)
                  else:
                      index=index.replace('<footer', ownership+'<footer', 1)

          # If About exists but Ownership text is not inside it, insert ownership block before that section closes.
          am=re.search(r'(<section[^>]*id="about"[^>]*>)(.*?)(</section>)', index, re.S|re.I)
          if am and 'Ownership Statement' not in am.group(2):
              own='''<div style="margin-top:24px"><h3 style="font-family:Georgia,serif">Ownership Statement</h3><p><strong>Learning Hub – Global Education Platform</strong> is owned and operated by <strong>Learning Hub Global Educational Services (SMC-Private) Limited</strong>, a company incorporated in Pakistan.</p><p><strong>Company Unique Identification Number (CUIN):</strong> 0358546 &nbsp; | &nbsp; <strong>Registered Office:</strong> Sindh, Pakistan</p></div>'''
              replacement=am.group(1)+am.group(2)+own+am.group(3)
              index=index[:am.start()]+replacement+index[am.end():]

          # 3) Footer address: exact same typography/color/line-height as adjacent footer links; text unchanged.
          index=index.replace('.footer small{color:#aaa}', '.footer small{color:#ddd;font-size:14px;line-height:1.45;font-family:Arial,Helvetica,sans-serif;font-weight:400}')
          # Add final narrow override if later CSS competes.
          if 'id="footer-address-match"' not in index:
              index=index.replace('</head>','<style id="footer-address-match">.footer .footer-contact-group small{font-family:Arial,Helvetica,sans-serif!important;font-size:14px!important;line-height:1.45!important;font-weight:400!important;color:#ddd!important}</style></head>',1)

          ip.write_text(index,encoding='utf-8')

          # Use the now-correct homepage header/footer as the literal master for every public root HTML subpage.
          index=ip.read_text(encoding='utf-8')
          hm=re.search(r'(<header class="top">.*?</header>)',index,re.S|re.I)
          fm=re.search(r'(<footer class="footer">.*?</footer>)',index,re.S|re.I)
          if not hm or not fm: raise SystemExit('Homepage master header/footer not found')
          header,footer=hm.group(1),fm.group(1)

          # Extract homepage header/footer-relevant CSS rather than imposing alternate geometry.
          # Remove the old authoritative override from subpages; preserve their page-specific content/styles.
          for p in root.glob('*.html'):
              if p.name=='index.html': continue
              s=p.read_text(encoding='utf-8')
              if '<header' not in s or '<footer' not in s: continue
              s=re.sub(r'<header\b.*?</header>',header,s,count=1,flags=re.S|re.I)
              s=re.sub(r'<footer\b.*?</footer>',footer,s,count=1,flags=re.S|re.I)
              s=re.sub(r'<style id="sitewide-chrome-authoritative">.*?</style>','',s,flags=re.S|re.I)
              # Neutralize standalone page header rules by appending homepage geometry only.
              master_css='''<style id="homepage-chrome-master">
              .top{position:sticky!important;top:0!important;z-index:50!important;background:#050505!important;border-bottom:1px solid rgba(201,164,92,.25)!important}
              .top .brandrow{width:min(1240px,calc(100% - 32px))!important;margin:auto!important;min-height:116px!important;height:auto!important;display:grid!important;grid-template-columns:82px 1fr auto!important;grid-template-rows:66px 42px!important;column-gap:16px!important;align-items:center!important;padding:4px 0!important}
              .top .brandrow>img{width:76px!important;height:76px!important;max-width:none!important;max-height:none!important;object-fit:contain!important;grid-column:1!important;grid-row:1/3!important;align-self:center!important;margin:0!important;padding:0!important}
              .top .brandrow>.brand{display:block!important;grid-column:2!important;grid-row:1!important;align-self:center!important;min-width:0!important}.top .brand strong{display:block!important;color:#fff!important;font-family:Georgia,serif!important;font-size:32px!important;line-height:1!important}.top .brand span{display:block!important;color:#f0d58e!important;font-size:11px!important;font-weight:800!important;letter-spacing:.08em!important;margin-top:6px!important}
              .top .nav{grid-column:2/4!important;grid-row:2!important;margin:0!important;width:100%!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:20px!important;white-space:nowrap!important;border-top:1px solid rgba(217,173,76,.22)!important;padding-top:7px!important}.top .nav button,.top .nav a{border:0!important;background:none!important;color:#fff!important;font-weight:700!important;font-size:12px!important;cursor:pointer!important;padding:7px 0!important;white-space:nowrap!important;text-decoration:none!important}.top .nav .book{margin-left:auto!important;background:linear-gradient(135deg,#f1d27e,#c99d43)!important;color:#111!important;padding:10px 20px!important;border-radius:12px!important}
              .footer .footer-contact-group small{font-family:Arial,Helvetica,sans-serif!important;font-size:14px!important;line-height:1.45!important;font-weight:400!important;color:#ddd!important}
              @media(max-width:980px){.top .brandrow{width:min(1180px,calc(100% - 36px))!important;min-height:74px!important;height:auto!important;display:flex!important;padding:0!important}.top .brandrow>img{width:62px!important;height:62px!important}.top .nav{display:none!important}}
              </style>'''
              s=re.sub(r'<style id="homepage-chrome-master">.*?</style>','',s,flags=re.S|re.I)
              s=s.replace('</head>',master_css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit approved corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Apply approved About Us and sitewide chrome corrections"
          git push

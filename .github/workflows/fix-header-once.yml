name: Move About Us to dedicated page
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-header-once.yml']
permissions:
  contents: write
jobs:
  move-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move About Us without changing catalogue homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'<section id="about".*?</section>',s,re.S|re.I)
          if not m: raise SystemExit('About section not found')
          about=m.group(0)
          s=s[:m.start()]+s[m.end():]
          s=s.replace('href="#about"','href="about.html"')
          s=re.sub(r'<style id="about-premium-style">.*?</style>','',s,flags=re.S|re.I)
          p.write_text(s,encoding='utf-8')

          # Dedicated About page uses the same website header/footer, while preserving the approved premium About content.
          hm=re.search(r'<header class="top">.*?</header>',s,re.S|re.I)
          fm=re.search(r'<footer class="footer">.*?</footer>',s,re.S|re.I)
          if not hm or not fm: raise SystemExit('Header/footer not found')
          base_css=re.search(r'<style>(.*?)</style>',s,re.S|re.I).group(1)
          about_css='''.lh-about{padding:54px 0 64px;background:linear-gradient(180deg,#f8f2e7 0%,#fffaf2 100%);min-height:calc(100vh - 200px)}.lh-about-head{text-align:center;max-width:850px;margin:0 auto 30px}.lh-about-head .eyebrow{color:#9a6b17}.lh-about-head h2{font:700 clamp(32px,3.5vw,48px)/1.05 Georgia,serif;margin:8px 0 12px;color:#15110c}.lh-about-head h2 em{font-style:normal;color:#9a6b17}.lh-about-head>p{max-width:720px;margin:auto;color:#655e54;font-size:15px}.lh-about-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:24px;align-items:stretch}.lh-about-story,.lh-company-card{border:1px solid #e3d2b2;border-radius:22px;box-shadow:0 14px 34px rgba(64,43,12,.08)}.lh-about-story{background:#fff;padding:30px}.lh-about-kicker,.lh-company-title>span{font-size:11px;letter-spacing:.16em;font-weight:800;color:#9a6b17}.lh-about-story h3,.lh-company-title h3{font:700 27px/1.15 Georgia,serif;margin:7px 0 14px;color:#17120d}.lh-about-story p{color:#5f584e;margin:0 0 13px}.lh-about-pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.lh-about-pillrow span{border:1px solid #dfc99f;background:#fff9ed;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:#594521}.lh-company-card{overflow:hidden;background:#090806;color:#fff}.lh-company-title{padding:27px 28px 22px;background:linear-gradient(135deg,#0a0907,#1a140a);border-bottom:1px solid rgba(240,213,142,.22)}.lh-company-title>span{color:#f0d58e}.lh-company-title h3{color:#fff;margin-bottom:9px}.lh-company-title p{color:#d8d1c6;margin:0;font-size:14px}.lh-company-fields{display:grid;grid-template-columns:1fr 1fr}.lh-company-fields>div{padding:20px 22px;border-right:1px solid rgba(240,213,142,.15);border-bottom:1px solid rgba(240,213,142,.15)}.lh-company-fields>div:nth-child(even){border-right:0}.lh-company-fields small{display:block;color:#d8b967;font-size:10px;font-weight:800;letter-spacing:.08em;line-height:1.35;margin-bottom:7px}.lh-company-fields strong{display:block;color:#fff;font-size:14px;line-height:1.45;font-weight:700}@media(max-width:800px){.lh-about{padding:42px 0}.lh-about-grid{grid-template-columns:1fr}.lh-company-fields{grid-template-columns:1fr}.lh-company-fields>div{border-right:0}.lh-about-story{padding:24px}}'''
          page='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>About Us | Learning Hub – Global Education Platform</title><meta name="description" content="About Learning Hub, our journey, company information and ownership statement."><link rel="canonical" href="https://learninghubtutoring.com/about.html"><link rel="icon" href="assets/learning-hub-logo.png?v=approved-20260923"><style>'''+base_css+about_css+'''</style></head><body>'''+hm.group(0)+about+fm.group(0)+'''</body></html>'''
          Path('about.html').write_text(page,encoding='utf-8')
          PY
      - name: Commit dedicated About page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html
          git diff --cached --quiet && exit 0
          git commit -m "Move About Us to dedicated page"
          git push

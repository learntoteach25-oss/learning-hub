name: Lock approved site chrome
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-header-once.yml']
permissions:
  contents: write
jobs:
  lock-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one canonical header and footer everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          index=(root/'index.html').read_text(encoding='utf-8')
          fm=re.search(r'<footer class="footer">.*?</footer>',index,re.S|re.I)
          if not fm: raise SystemExit('Approved homepage footer not found')
          footer=fm.group(0)

          header='''<header class="top lh-locked-header"><div class="shell brandrow"><a class="lh-logo-link" href="/"><img src="assets/learning-hub-logo.png?v=approved-20260923" alt="Learning Hub – Global Education Platform"></a><nav class="nav" aria-label="Primary navigation"><a href="/#programmes">Programmes</a><a href="/#quran">Quran &amp; Islamic Studies</a><a href="/#boards">International Boards</a><a href="/#exams">Exams</a><a href="/#support">Learning Support</a><a href="/#resources">Resources</a><a href="/#teach">Teach with Us</a><a href="/#contact">Contact</a><a href="/about.html">About Us</a><a href="/policies.html">Policies</a><a class="book" href="/#book">Book Now</a></nav></div></header>'''

          css='''<style id="lh-sitewide-chrome-lock">
          .lh-locked-header{position:sticky!important;top:0!important;z-index:999!important;background:#050505!important;border-bottom:1px solid rgba(201,164,92,.25)!important}
          .lh-locked-header .shell.brandrow{width:min(1240px,calc(100% - 32px))!important;height:104px!important;min-height:104px!important;margin:0 auto!important;padding:0!important;display:flex!important;align-items:center!important;gap:22px!important}
          .lh-locked-header .lh-logo-link{width:150px!important;min-width:150px!important;height:94px!important;display:flex!important;align-items:center!important;justify-content:flex-start!important}
          .lh-locked-header .lh-logo-link img{display:block!important;width:150px!important;height:94px!important;max-width:none!important;object-fit:contain!important;margin:0!important;padding:0!important}
          .lh-locked-header .nav{margin-left:auto!important;width:auto!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:20px!important;flex-wrap:nowrap!important;white-space:nowrap!important;border:0!important;padding:0!important}
          .lh-locked-header .nav a,.lh-locked-header .nav button{display:inline-flex!important;align-items:center!important;color:#fff!important;background:none!important;border:0!important;font:700 12px/1 Arial,Helvetica,sans-serif!important;padding:8px 0!important;margin:0!important;white-space:nowrap!important;text-decoration:none!important}
          .lh-locked-header .nav .book{margin-left:4px!important;background:linear-gradient(135deg,#f1d27e,#c99d43)!important;color:#111!important;padding:14px 22px!important;border-radius:14px!important;min-width:100px!important;justify-content:center!important}
          @media(max-width:1100px){.lh-locked-header .nav{gap:12px!important}.lh-locked-header .nav a,.lh-locked-header .nav button{font-size:11px!important}.lh-locked-header .lh-logo-link,.lh-locked-header .lh-logo-link img{width:132px!important;min-width:132px!important}}
          @media(max-width:980px){.lh-locked-header .shell.brandrow{height:82px!important;min-height:82px!important}.lh-locked-header .lh-logo-link{height:74px!important}.lh-locked-header .lh-logo-link img{height:74px!important}.lh-locked-header .nav{display:none!important}}
          </style>'''

          # Root public pages use identical approved chrome. Page bodies are not touched.
          pages=['index.html','about.html','policies.html','ownership.html','billing.html','free-resources.html','404.html']
          changed=[]
          for name in pages:
              p=root/name
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<style id="lh-sitewide-chrome-lock">.*?</style>','',s,flags=re.S|re.I)
              s=re.sub(r'<header class="top(?:\s+lh-locked-header)?">.*?</header>',header,s,count=1,flags=re.S|re.I)
              s=re.sub(r'<footer class="footer">.*?</footer>',footer,s,count=1,flags=re.S|re.I)
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
              changed.append(name)
          print('Locked chrome on:', ', '.join(changed))
          PY
      - name: Commit locked site chrome
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html policies.html ownership.html billing.html free-resources.html 404.html
          git diff --cached --quiet && exit 0
          git commit -m "Lock identical approved header and footer across website"
          git push

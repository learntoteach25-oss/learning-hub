name: Restyle About Us section only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-header-once.yml']
permissions:
  contents: write
jobs:
  about-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restyle About Us only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r'<section id="about".*?</section>',s,re.S|re.I)
          if not m: raise SystemExit('About section not found')
          new='''<section id="about" class="lh-about"><div class="shell"><div class="lh-about-head"><div class="eyebrow">ABOUT LEARNING HUB</div><h2>Experience Built Over Time.<br><em>Access Designed for Today.</em></h2><p>Learning Hub brings together years of academic facilitation, learner support and educational resource development in one accessible global platform.</p></div><div class="lh-about-grid"><div class="lh-about-story"><div class="lh-about-kicker">OUR JOURNEY</div><h3>Supporting learners since 2008</h3><p>Our journey began with on-site academic facilitation and personalised learning support. As learner needs evolved, Learning Hub expanded online to make structured academic support, premium learning resources and global education opportunities more accessible to students and families.</p><p>Today, <strong>Learning Hub – Global Education Platform</strong> connects learners with academic support, learning resources and education opportunities through a professionally structured online environment.</p><div class="lh-about-pillrow"><span>Academic Support</span><span>Learning Resources</span><span>International Curricula</span><span>Exam Preparation</span></div></div><aside class="lh-company-card"><div class="lh-company-title"><span>COMPANY INFORMATION</span><h3>Ownership Statement</h3><p>Learning Hub – Global Education Platform is owned and operated by a company incorporated in Pakistan.</p></div><div class="lh-company-fields"><div><small>LEGAL ENTITY</small><strong>Learning Hub Global Educational Services<br>(SMC-Private) Limited</strong></div><div><small>COMPANY UNIQUE IDENTIFICATION NUMBER (CUIN)</small><strong>0358546</strong></div><div><small>REGISTERED OFFICE</small><strong>Sindh, Pakistan</strong></div><div><small>WEBSITE</small><strong>learninghubtutoring.com</strong></div></div></aside></div></div></section>'''
          s=s[:m.start()]+new+s[m.end():]
          css='''<style id="about-premium-style">.lh-about{padding:72px 0 78px;background:linear-gradient(180deg,#f8f2e7 0%,#fffaf2 100%);border-top:1px solid rgba(201,164,92,.25);border-bottom:1px solid rgba(201,164,92,.25)}.lh-about-head{text-align:center;max-width:850px;margin:0 auto 34px}.lh-about-head .eyebrow{color:#9a6b17}.lh-about-head h2{font:700 clamp(32px,3.5vw,48px)/1.05 Georgia,serif;margin:8px 0 12px;color:#15110c}.lh-about-head h2 em{font-style:normal;color:#9a6b17}.lh-about-head>p{max-width:720px;margin:auto;color:#655e54;font-size:15px}.lh-about-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:24px;align-items:stretch}.lh-about-story,.lh-company-card{border:1px solid #e3d2b2;border-radius:22px;box-shadow:0 14px 34px rgba(64,43,12,.08)}.lh-about-story{background:#fff;padding:30px}.lh-about-kicker,.lh-company-title>span{font-size:11px;letter-spacing:.16em;font-weight:800;color:#9a6b17}.lh-about-story h3,.lh-company-title h3{font:700 27px/1.15 Georgia,serif;margin:7px 0 14px;color:#17120d}.lh-about-story p{color:#5f584e;margin:0 0 13px}.lh-about-pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.lh-about-pillrow span{border:1px solid #dfc99f;background:#fff9ed;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:#594521}.lh-company-card{overflow:hidden;background:#090806;color:#fff}.lh-company-title{padding:27px 28px 22px;background:linear-gradient(135deg,#0a0907,#1a140a);border-bottom:1px solid rgba(240,213,142,.22)}.lh-company-title>span{color:#f0d58e}.lh-company-title h3{color:#fff;margin-bottom:9px}.lh-company-title p{color:#d8d1c6;margin:0;font-size:14px}.lh-company-fields{display:grid;grid-template-columns:1fr 1fr}.lh-company-fields>div{padding:20px 22px;border-right:1px solid rgba(240,213,142,.15);border-bottom:1px solid rgba(240,213,142,.15)}.lh-company-fields>div:nth-child(even){border-right:0}.lh-company-fields small{display:block;color:#d8b967;font-size:10px;font-weight:800;letter-spacing:.08em;line-height:1.35;margin-bottom:7px}.lh-company-fields strong{display:block;color:#fff;font-size:14px;line-height:1.45;font-weight:700}@media(max-width:800px){.lh-about{padding:52px 0}.lh-about-grid{grid-template-columns:1fr}.lh-company-fields{grid-template-columns:1fr}.lh-company-fields>div{border-right:0}.lh-about-story{padding:24px}}</style>'''
          s=re.sub(r'<style id="about-premium-style">.*?</style>','',s,flags=re.S|re.I)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit About Us styling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore premium About Us presentation"
          git push

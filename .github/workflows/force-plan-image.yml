name: Force load booking plan image
on:
  push:
    paths:
      - '.github/workflows/force-plan-image.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use a cache-safe plan image URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          s = s.replace('src="assets/plans/learning-hub-plan-options.jpg"', 'src="https://learninghubtutoring.com/assets/plans/learning-hub-plan-options.jpg?v=2" loading="eager"')
          p.write_text(s)
          PY
      - name: Commit fix and remove helper
        run: |
          git config user.name "Learning Hub Updates"
          git config user.email "updates@learninghubtutoring.com"
          git rm .github/workflows/force-plan-image.yml
          git add index.html
          git commit -m "Force load booking plan image"
          git push

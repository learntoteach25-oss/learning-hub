name: Sync approved site chrome
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-approved-site-chrome.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep catalogue-only homepage and shared chrome
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          home=root/'index.html'
          s=home.read_text(encoding='utf-8')
          s=re.sub(r'<style id="lh-approved-chrome">.*?</style>','',s,flags=re.S|re.I)
          s=re.sub(r'<style id="lh-homepage-catalogue-lock">.*?</style>','',s,flags=re.S|re.I)
          s=re.sub(r'<script id="lh-homepage-reset">.*?</script>','',s,flags=re.S|re.I)

          chrome='''<style id="lh-approved-chrome">
          @media (min-width:981px){
            .top .brandrow{min-height:88px!important;display:flex!important;align-items:center!important;gap:18px!important;padding:0!important;grid-template:none!important}
            .top .brandrow>img{width:72px!important;height:72px!important;object-fit:contain!important;flex:0 0 72px!important}
            .top .brand{min-width:150px!important}.top .brand strong{font-size:28px!important;line-height:1!important}.top .brand span{font-size:9px!important;margin-top:5px!important}
            .top .nav{margin-left:auto!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:16px!important;flex-wrap:nowrap!important;white-space:nowrap!important;border:0!important;padding:0!important}
            .top .nav button,.top .nav a{font-size:12px!important;padding:8px 0!important;white-space:nowrap!important}.top .nav .book{margin-left:4px!important;padding:12px 20px!important;border-radius:13px!important}
            .detail-toolbar,.detail-view .detail-toolbar{top:88px!important}
          }</style>'''

          # Root homepage is catalogue only. Enquiry/contact, feedback/reviews, hero
          # and about content stay accessible only through their designated links/views.
          home_lock='''<style id="lh-homepage-catalogue-lock">
          body.home-front .hero,
          body.home-front .contact-wrap,
          body.home-front .feedback-wrap,
          body.home-front .about-wrap,
          body.home-front #contact,
          body.home-front #feedback,
          body.home-front [data-section="contact"],
          body.home-front [data-section="feedback"]{display:none!important}
          body.home-front .areas,body.home-front .catalogue-page{display:block!important}
          </style>'''
          s=s.replace('</head>',chrome+home_lock+'</head>',1)
          s=re.sub(r'<body(?![^>]*class=)([^>]*)>',r'<body class="home-front"\1>',s,count=1,flags=re.I)
          s=re.sub(r'<body class="([^"]*)"',lambda m:'<body class="'+(('home-front '+m.group(1)).strip() if 'home-front' not in m.group(1).split() else m.group(1))+'"',s,count=1,flags=re.I)

          reset='''<script id="lh-homepage-reset">document.addEventListener('DOMContentLoaded',function(){if(location.pathname==='/'||location.pathname==='/index.html'){document.body.classList.add('home-front');document.querySelectorAll('.detail-view.active').forEach(function(x){x.classList.remove('active')});['.contact-wrap','.feedback-wrap','.about-wrap','#contact','#feedback'].forEach(function(sel){document.querySelectorAll(sel).forEach(function(x){x.style.display='none'})});var a=document.querySelector('.areas');if(a)a.style.display='block';}});</script>'''
          s=s.replace('</body>',reset+'</body>',1)
          home.write_text(s,encoding='utf-8')

          hm=re.search(r'<header class="top".*?</header>',s,re.S|re.I); fm=re.search(r'<footer class="footer".*?</footer>',s,re.S|re.I)
          if not hm or not fm: raise SystemExit('Homepage header/footer not found')
          header,footer=hm.group(0),fm.group(0)
          for name in ['about.html','policies.html','ownership.html','billing.html','free-resources.html','404.html']:
            p=root/name
            if not p.exists(): continue
            body=p.read_text(encoding='utf-8')
            body=re.sub(r'<style id="lh-approved-chrome">.*?</style>','',body,flags=re.S|re.I)
            body,_=re.subn(r'<header class="top".*?</header>',header,body,count=1,flags=re.S|re.I)
            body,_=re.subn(r'<footer class="footer".*?</footer>',footer,body,count=1,flags=re.S|re.I)
            body=body.replace('</head>',chrome+'</head>',1)
            p.write_text(body,encoding='utf-8')
          PY
      - name: Commit synchronized site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html about.html policies.html ownership.html billing.html free-resources.html 404.html 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Keep enquiry and feedback off catalogue homepage'
            git push
          fi

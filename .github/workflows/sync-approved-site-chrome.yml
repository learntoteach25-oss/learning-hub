name: Enforce identical site header and footer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-approved-site-chrome.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy homepage chrome and neutralize page-specific resizing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          home=root/'index.html'
          s=home.read_text(encoding='utf-8')
          hm=re.search(r'<header class="top".*?</header>',s,re.S|re.I)
          fm=re.search(r'<footer class="footer".*?</footer>',s,re.S|re.I)
          if not hm or not fm: raise SystemExit('Homepage master chrome not found')
          header,footer=hm.group(0),fm.group(0)
          css='''<style id="lh-uniform-chrome-final">
          @media(min-width:981px){
          .top{height:106px!important;min-height:106px!important;overflow:hidden!important;background:#050505!important}
          .top .brandrow{width:min(1280px,calc(100% - 48px))!important;height:106px!important;min-height:106px!important;margin:auto!important;padding:0!important;display:flex!important;align-items:center!important;gap:28px!important;grid-template:none!important;grid-template-columns:none!important;grid-template-rows:none!important}
          .top .brandrow>img{display:block!important;width:160px!important;height:94px!important;max-width:160px!important;max-height:94px!important;object-fit:contain!important;flex:0 0 160px!important;margin:0!important;padding:0!important;grid-column:auto!important;grid-row:auto!important}
          .top .brandrow>.brand{display:none!important}
          .top .nav{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:18px!important;flex:1!important;min-width:0!important;width:auto!important;margin:0!important;padding:0!important;border:0!important;white-space:nowrap!important;grid-column:auto!important;grid-row:auto!important}
          .top .nav a,.top .nav button{font:700 12px/1 Arial,sans-serif!important;color:#fff!important;white-space:nowrap!important;padding:8px 0!important;margin:0!important}
          .top .nav .book{margin-left:2px!important;padding:14px 22px!important;border-radius:13px!important;color:#111!important}
          }
          .footer{background:#050505!important;color:#fff!important}.footer img.logo,.footer .logo{max-width:240px!important;height:auto!important;object-fit:contain!important}.footer .whatsapp{max-width:280px!important}
          </style>'''
          pages=['index.html','about.html','policies.html','ownership.html','billing.html','free-resources.html','404.html']
          for name in pages:
            p=root/name
            if not p.exists(): continue
            b=p.read_text(encoding='utf-8')
            b=re.sub(r'<style id="lh-uniform-chrome-final">.*?</style>','',b,flags=re.S|re.I)
            if name!='index.html':
              b,n1=re.subn(r'<header class="top".*?</header>',header,b,count=1,flags=re.S|re.I)
              b,n2=re.subn(r'<footer class="footer".*?</footer>',footer,b,count=1,flags=re.S|re.I)
              if not n1: print('header not found:',name)
              if not n2: print('footer not found:',name)
            b=b.replace('</head>',css+'</head>',1)
            p.write_text(b,encoding='utf-8')
          PY
      - name: Commit uniform chrome
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html about.html policies.html ownership.html billing.html free-resources.html 404.html 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'Enforce identical homepage header and footer site-wide'; git push; fi

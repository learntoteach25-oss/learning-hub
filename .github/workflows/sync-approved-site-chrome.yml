name: Fix public homepage routing and chat presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-approved-site-chrome.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force catalogue entry and distinct WhatsApp
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.'); home=root/'index.html'
          s=home.read_text(encoding='utf-8')
          # Remove previous hotfix blocks.
          for ident in ['lh-entry-router','lh-whatsapp-style']:
              s=re.sub(r'<style id="'+ident+r'">.*?</style>','',s,flags=re.S|re.I)
              s=re.sub(r'<script id="'+ident+r'">.*?</script>','',s,flags=re.S|re.I)
          # Root remains catalogue even with ?utm_source=..., fbclid etc. Hashes are allowed only after explicit in-site navigation.
          router='''<script id="lh-entry-router">(function(){
          var root=location.pathname==='/'||location.pathname==='/index.html';
          if(root && location.search){history.replaceState({lhCatalogue:true},'',location.pathname);}
          function forceHome(){
            if(!root)return;
            document.body.classList.add('lh-root-home');
            document.querySelectorAll('.detail-view').forEach(function(v){v.classList.remove('active');v.style.display='none'});
            ['.hero','.contact-wrap','.feedback-wrap','.feedback-section','.feedback-page','.about-wrap','#contact','#feedback','#about'].forEach(function(sel){document.querySelectorAll(sel).forEach(function(el){el.style.display='none'})});
            document.querySelectorAll('.areas,.catalogue-page').forEach(function(el){el.style.display='block';el.style.visibility='visible'});
            window.scrollTo(0,0);
          }
          document.addEventListener('DOMContentLoaded',forceHome); window.addEventListener('pageshow',forceHome);
          })();</script>'''
          wa='''<style id="lh-whatsapp-style">
          .footer .whatsapp{display:inline-flex!important;align-items:center!important;gap:10px!important;background:#fff!important;color:#111!important;border:1px solid #d6a83d!important;border-radius:14px!important;padding:10px 14px!important;box-shadow:none!important;font-weight:700!important}
          .footer .whatsapp::before{content:'☎';display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#25D366;color:#fff;font-size:17px;font-family:Arial,sans-serif}
          </style>'''
          s=s.replace('</head>',wa+'</head>',1)
          s=s.replace('</body>',router+'</body>',1)
          home.write_text(s,encoding='utf-8')
          # Also ensure About cannot become the domain entry through canonical/root links.
          for name in ['about.html','policies.html','ownership.html','billing.html','free-resources.html','404.html']:
              p=root/name
              if not p.exists(): continue
              b=p.read_text(encoding='utf-8')
              b=re.sub(r'<style id="lh-whatsapp-style">.*?</style>','',b,flags=re.S|re.I)
              b=b.replace('</head>',wa+'</head>',1)
              p.write_text(b,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html about.html policies.html ownership.html billing.html free-resources.html 404.html 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'Force catalogue on external root entry and distinguish WhatsApp'; git push; fi

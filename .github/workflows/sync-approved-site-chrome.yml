name: Enforce professional site chrome and chat UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-approved-site-chrome.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate chat controls and polish WhatsApp
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages=['index.html','about.html','policies.html','ownership.html','billing.html','free-resources.html','404.html']
          css='''<style id="lh-chat-ui-authoritative">
          /* One clean WhatsApp action in the footer; Tidio remains the only floating chat. */
          .footer .whatsapp{
            display:inline-flex!important;align-items:center!important;gap:11px!important;
            width:auto!important;max-width:260px!important;min-height:54px!important;
            margin:16px 0 0!important;padding:9px 14px!important;
            background:#fff!important;color:#111!important;border:1px solid #d9aa49!important;
            border-radius:13px!important;box-shadow:none!important;text-decoration:none!important;
            font-family:Arial,Helvetica,sans-serif!important;
          }
          .footer .whatsapp::before{display:none!important;content:none!important}
          .footer .whatsapp .wa-mark,.footer .whatsapp .wa-icon{
            display:grid!important;place-items:center!important;width:34px!important;height:34px!important;
            flex:0 0 34px!important;border-radius:50%!important;background:#25D366!important;color:#fff!important;
            font:800 10px/1 Arial,sans-serif!important;
          }
          .footer .whatsapp strong{display:block!important;margin:0!important;color:#111!important;font:700 13px/1.15 Arial,sans-serif!important}
          .footer .whatsapp small{display:block!important;margin:3px 0 0!important;color:#6b6258!important;font:400 10px/1.2 Arial,sans-serif!important}
          .floating-chat,.footer-ai-chat{display:none!important}
          /* Separate Tidio from the footer WhatsApp control and keep the viewport tidy. */
          #tidio-chat-iframe{left:14px!important;right:auto!important}
          @media(max-width:640px){
            .footer .whatsapp{max-width:235px!important;min-height:50px!important;padding:8px 12px!important}
            #tidio-chat-iframe{left:8px!important;right:auto!important}
          }
          </style>'''

          for name in pages:
            p=Path(name)
            if not p.exists():
              continue
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'<style id="lh-chat-ui-authoritative">.*?</style>','',s,flags=re.S|re.I)
            # Remove any legacy custom floating WhatsApp/chat anchors; Tidio is retained.
            s=re.sub(r'<a\b[^>]*class=["\'][^"\']*floating-chat[^"\']*["\'][^>]*>.*?</a>','',s,flags=re.S|re.I)
            # Remove legacy footer AI-chat buttons that duplicate Tidio.
            s=re.sub(r'<button\b[^>]*class=["\'][^"\']*footer-ai-chat[^"\']*["\'][^>]*>.*?</button>','',s,flags=re.S|re.I)
            if '</head>' in s:
              s=s.replace('</head>',css+'</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit professional chat UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html about.html policies.html ownership.html billing.html free-resources.html 404.html 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Polish WhatsApp and Tidio presentation site-wide'
            git push
          fi

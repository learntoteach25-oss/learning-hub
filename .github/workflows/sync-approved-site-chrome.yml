name: Sync approved site chrome
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-approved-site-chrome.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep catalogue homepage clean and polish feedback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.'); home=root/'index.html'; s=home.read_text(encoding='utf-8')
          for ident in ['lh-approved-chrome','lh-homepage-catalogue-lock','lh-feedback-polish']:
            s=re.sub(r'<style id="'+ident+r'">.*?</style>','',s,flags=re.S|re.I)
          s=re.sub(r'<script id="lh-homepage-reset">.*?</script>','',s,flags=re.S|re.I)

          chrome='''<style id="lh-approved-chrome">@media (min-width:981px){.top .brandrow{min-height:88px!important;display:flex!important;align-items:center!important;gap:18px!important;padding:0!important;grid-template:none!important}.top .brandrow>img{width:72px!important;height:72px!important;object-fit:contain!important;flex:0 0 72px!important}.top .brand{min-width:150px!important}.top .brand strong{font-size:28px!important;line-height:1!important}.top .brand span{font-size:9px!important;margin-top:5px!important}.top .nav{margin-left:auto!important;display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:16px!important;flex-wrap:nowrap!important;white-space:nowrap!important;border:0!important;padding:0!important}.top .nav button,.top .nav a{font-size:12px!important;padding:8px 0!important;white-space:nowrap!important}.top .nav .book{margin-left:4px!important;padding:12px 20px!important;border-radius:13px!important}}</style>'''
          lock='''<style id="lh-homepage-catalogue-lock">body.home-front .hero,body.home-front .contact-wrap,body.home-front .feedback-wrap,body.home-front .feedback-section,body.home-front .feedback-page,body.home-front .about-wrap,body.home-front #contact,body.home-front #feedback,body.home-front form[action*="feedback" i]{display:none!important}body.home-front .areas,body.home-front .catalogue-page{display:block!important}</style>'''
          polish='''<style id="lh-feedback-polish">
          .feedback-wrap,.feedback-section,.feedback-page{max-width:1120px!important;margin:42px auto!important;padding:0 24px!important}
          .feedback-wrap form,.feedback-section form,.feedback-page form{max-width:820px!important;margin:28px auto!important;padding:34px!important;background:#fff!important;border:1px solid #e6d2a5!important;border-radius:22px!important;box-shadow:0 14px 38px rgba(0,0,0,.07)!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:20px 24px!important}
          .feedback-wrap form label,.feedback-section form label,.feedback-page form label{font-weight:700!important;margin:0 0 7px!important;display:block!important}
          .feedback-wrap form input,.feedback-wrap form select,.feedback-wrap form textarea,.feedback-section form input,.feedback-section form select,.feedback-section form textarea,.feedback-page form input,.feedback-page form select,.feedback-page form textarea{width:100%!important;box-sizing:border-box!important;border:1px solid #d8c9ac!important;border-radius:10px!important;padding:12px 14px!important;font:inherit!important;background:#fff!important}
          .feedback-wrap form textarea,.feedback-section form textarea,.feedback-page form textarea{min-height:130px!important;resize:vertical!important}
          .feedback-wrap form button,.feedback-section form button,.feedback-page form button{min-height:46px!important;border-radius:12px!important;font-weight:700!important}
          @media(max-width:700px){.feedback-wrap form,.feedback-section form,.feedback-page form{grid-template-columns:1fr!important;padding:22px!important}}
          </style>'''
          s=s.replace('</head>',chrome+lock+polish+'</head>',1)
          s=re.sub(r'<body(?![^>]*class=)([^>]*)>',r'<body class="home-front"\1>',s,count=1,flags=re.I)
          s=re.sub(r'<body class="([^"]*)"',lambda m:'<body class="'+(('home-front '+m.group(1)).strip() if 'home-front' not in m.group(1).split() else m.group(1))+'"',s,count=1,flags=re.I)
          reset='''<script id="lh-homepage-reset">document.addEventListener('DOMContentLoaded',function(){var root=location.pathname==='/'||location.pathname==='/index.html';if(root&&!location.hash){document.body.classList.add('home-front');document.querySelectorAll('.detail-view.active').forEach(x=>x.classList.remove('active'));document.querySelectorAll('section,div').forEach(function(x){var t=(x.querySelector('h1,h2,h3')||{}).textContent||'';if(/feedback means a lot|feedback & reviews|send an enquiry|general enquiries/i.test(t)){var box=x.closest('section')||x;box.style.display='none'}});var a=document.querySelector('.areas');if(a)a.style.display='block';}else if(location.hash){document.body.classList.remove('home-front');}});</script>'''
          s=s.replace('</body>',reset+'</body>',1); home.write_text(s,encoding='utf-8')
          hm=re.search(r'<header class="top".*?</header>',s,re.S|re.I); fm=re.search(r'<footer class="footer".*?</footer>',s,re.S|re.I)
          if not hm or not fm: raise SystemExit('Homepage header/footer not found')
          header,footer=hm.group(0),fm.group(0)
          for name in ['about.html','policies.html','ownership.html','billing.html','free-resources.html','404.html']:
            p=root/name
            if not p.exists(): continue
            b=p.read_text(encoding='utf-8')
            b=re.sub(r'<style id="lh-approved-chrome">.*?</style>','',b,flags=re.S|re.I)
            b,_=re.subn(r'<header class="top".*?</header>',header,b,count=1,flags=re.S|re.I); b,_=re.subn(r'<footer class="footer".*?</footer>',footer,b,count=1,flags=re.S|re.I)
            b=b.replace('</head>',chrome+'</head>',1); p.write_text(b,encoding='utf-8')
          PY
      - name: Commit synchronized site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html about.html policies.html ownership.html billing.html free-resources.html 404.html 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m 'Remove feedback from homepage and polish feedback form'; git push; fi

name: Repair site image dependencies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-images:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair external site images
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          urls = re.findall(r'https://images\.unsplash\.com/[^\"\)]+', s)
          urls = list(dict.fromkeys(urls))

          assets = Path('assets/site')
          assets.mkdir(parents=True, exist_ok=True)

          def esc(v):
              return v.replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;')

          def make_svg(label, subtitle, icon):
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
              <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset="1" stop-color="#8e6b2d"/></linearGradient></defs>
              <rect width="1200" height="800" fill="url(#g)"/><circle cx="980" cy="150" r="220" fill="#c9a45c" opacity=".10"/><circle cx="180" cy="680" r="260" fill="#000" opacity=".18"/>
              <rect x="45" y="45" width="1110" height="710" rx="35" fill="none" stroke="#f0d58e" stroke-opacity=".45" stroke-width="2"/>
              <text x="600" y="350" text-anchor="middle" fill="#f0d58e" font-family="Georgia,serif" font-size="150" font-weight="700">{esc(icon)}</text>
              <text x="70" y="585" fill="#fffdf8" font-family="Georgia,serif" font-size="58" font-weight="700">{esc(label)}</text>
              <text x="70" y="640" fill="#f0d58e" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">{esc(subtitle.upper())}</text>
              <text x="70" y="700" fill="#fffdf8" opacity=".65" font-family="Arial,sans-serif" font-size="18">Learning for Everyone, Everywhere</text>
              </svg>'''

          labels = [
            ('Global Online Learning','LEARNING HUB','LH'),
            ('Academic Learning','ACADEMIC TUTORING','Aa'),
            ('International Curriculum','IB • CAMBRIDGE • GLOBAL','IB'),
            ('English Development','LANGUAGES & COMMUNICATION','A'),
            ('Exam Preparation','IELTS • PTE • EXAMS','✓'),
            ('Study Skills','LEARNING SUPPORT','01'),
            ('Quran & Islamic Studies','QURAN • TAJWEED • ISLAMIC STUDIES','☾'),
            ('Digital Learning','ONLINE EDUCATION','⌘'),
            ('Learning Resources','E-BOOKS • WORKSHEETS • PRACTICE','▤'),
            ('Personalised Learning','SPECIALIST SUPPORT','◎'),
            ('Learning Community','GLOBAL LEARNERS','◌'),
            ('Join Learning Hub','EDUCATORS & LEARNERS','LH'),
          ]

          replacements = {}
          for i, url in enumerate(urls):
              label, subtitle, icon = labels[i % len(labels)]
              name = f'visual-{i+1:02d}.svg'
              (assets / name).write_text(make_svg(label, subtitle, icon), encoding='utf-8')
              replacements[url] = f'assets/site/{name}'

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')

      - name: Commit repaired site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/site
          if git diff --cached --quiet; then
            echo "No image repair changes required."
            exit 0
          fi
          git commit -m "Replace unstable external site images with built-in visuals"
          git push

name: Refine Learning Hub Palette
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-learning-hub-palette.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore black, cream and gold visual language
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r':root\{[^}]+\}',s)
          if not old:
              raise SystemExit('Root palette not found')
          new=':root{--navy:#080808;--blue:#b8893d;--sky:#f4eee2;--cream:#fbf8f1;--gold:#c9a45c;--ink:#171512;--muted:#655f57;--line:#ddd4c5;--white:#fffdf8;--shadow:0 18px 45px rgba(0,0,0,.10);--r:20px;--max:1180px}'
          s=s[:old.start()]+new+s[old.end():]
          s=s.replace('background:rgba(255,255,255,.96)','background:rgba(255,253,248,.97)')
          s=s.replace('color:#465965','color:#3f3932')
          s=s.replace('background:#edf6fa','background:#f4eee2')
          s=s.replace('linear-gradient(135deg,#f8fbfd,#edf6fa 58%,#fffaf0)','linear-gradient(135deg,#fbf8f1,#f4eee2 58%,#fffdf8)')
          s=s.replace('color:#52636e','color:#514a42')
          s=s.replace('color:#50616c','color:#514a42')
          s=s.replace('color:#455862','color:#403a33')
          s=s.replace('color:#bfd0d8','color:#d8cec0')
          s=s.replace('color:#9fb4be','color:#bcae9e')
          s=s.replace('background:#173a56','background:#121212')
          s=s.replace('background:#10273b','background:#0b0b0b')
          s=s.replace('background:#285a7e','background:#242018')
          s=s.replace('background:linear-gradient(135deg,var(--navy),#285a7e)','background:linear-gradient(135deg,#080808,#242018)')
          s=s.replace('background:linear-gradient(145deg,#244a69,#17324d)','background:linear-gradient(145deg,#17130d,#080808)')
          s=s.replace('background:linear-gradient(145deg,#edf6fa,#fff8ec)','background:linear-gradient(145deg,#f4eee2,#fffdf8)')
          s=s.replace('border:1px solid rgba(47,111,159,.14)','border:1px solid rgba(201,164,92,.22)')
          marker='</style>'
          overrides='''\n/* Final visual refinement: preserve the original Learning Hub black / cream / gold language and guarantee readable contrast. */\n.quran .eyebrow,.exams .eyebrow,.teach .eyebrow{color:#f0d58e !important}\n.quran,.exams,footer{color:#fffdf8}\n.quran p,.exams p,.teach p{color:#ded5c8}\n.qitem span,.exam li{color:#cfc4b5}\n.exams h2,.exams h3,.quran h2,.quran h3,.teach h2{color:#fffdf8}\n.nav a,.nav .brand small{color:#554d44}\n.nav .brand b{color:#080808}\n.btn.secondary{background:#fffdf8;color:#080808;border-color:#c9a45c}\n.gold{color:#171512 !important;background:#d5b46f}\n.card,.boardCard,.review,.contactCard,.step,.subjectBox,.ib,.scene,.stat{color:#171512}\n.card h3,.boardCard h3,.review cite,.step b,.contactCard h3{color:#171512}\n.card p,.boardCard p,.review blockquote,.step p,.contactCard p{color:#655f57}\n.pill{color:#3f3932;background:#fffdf8;border-color:#d9cdbb}\n.galleryCard strong{color:#171512}\n.galleryCard small{color:#655f57}\n.resourceList a{color:#fffdf8}\n.resourceList a:hover{background:rgba(201,164,92,.15)}\n'''
          s=s.replace(marker,overrides+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Learning Hub'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'Restore Learning Hub black cream gold palette' || exit 0
          git push

name: Align contact buttons
on:
  push:
    paths:
      - '.github/workflows/align-contact-buttons.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align WhatsApp with chat button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          css = """<style id="learning-hub-contact-button-alignment">
          .lh-whatsapp-float{bottom:52px!important}
          @media(max-width:620px){.lh-whatsapp-float{bottom:44px!important}}
          </style>"""
          s = s.replace('</body>', css + '</body>')
          p.write_text(s)
          PY
      - name: Commit change and remove helper
        run: |
          git config user.name "Learning Hub Updates"
          git config user.email "updates@learninghubtutoring.com"
          git rm .github/workflows/align-contact-buttons.yml
          git add index.html
          git commit -m "Align WhatsApp with chat control"
          git push

name: Remove booking header gap
on:
  push:
    paths:
      - '.github/workflows/remove-booking-header-gap.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collapse empty header space
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          css = """<style id="learning-hub-booking-header-gap">
          #lhCheckoutRoot .lh-co-hero{height:auto!important;min-height:0!important;margin:0!important;padding:14px 0 0!important}
          #lhCheckoutRoot .lh-co-hero h1{margin:5px 0 8px!important}
          #lhBookingPanel{margin-top:0!important}
          </style>"""
          s = s.replace('</body>', css + '</body>')
          p.write_text(s)
          PY
      - name: Commit change and remove helper
        run: |
          git config user.name "Learning Hub Updates"
          git config user.email "updates@learninghubtutoring.com"
          git rm .github/workflows/remove-booking-header-gap.yml
          git add index.html
          git commit -m "Remove booking header gap"
          git push

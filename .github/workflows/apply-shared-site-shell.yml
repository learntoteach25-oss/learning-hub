name: Apply shared Learning Hub shell
on:
  push:
    paths:
      - '.github/workflows/apply-shared-site-shell.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared shell loader to every site page
        run: |
          python - <<'PY'
          from pathlib import Path
          loader='<script src="assets/site-shell.js?v=20261002-shell1"></script>'
          skip={'.git','node_modules'}
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(x in p.parts for x in skip):
                  continue
              s=p.read_text(encoding='utf-8')
              if 'assets/site-shell.js' in s:
                  continue
              if '</body>' in s:
                  s=s.replace('</body>',loader+'</body>',1)
              else:
                  s+=loader
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('Updated',len(changed),'HTML files')
          PY
      - name: Commit normalized pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html' || true
          git commit -m "Normalize all pages to shared site shell"
          git push
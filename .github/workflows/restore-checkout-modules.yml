name: Restore checkout modules
on:
  push:
    paths:
      - '.github/workflows/restore-checkout-modules.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore resource booking and gateway
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("index.html")
          text = page.read_text()
          marker = 'id="learning-hub-checkout-modules-restored"'
          if marker not in text:
              css = """<style id="learning-hub-checkout-modules-restored">
body.lh-checkout-mode #lhResourcePanel,
body.lh-checkout-mode #lhGatewaySection{display:block!important}
body.lh-checkout-mode #lhResourcePanel{margin-top:14px!important}
body.lh-checkout-mode #lhGatewaySection{margin-top:14px!important}
</style>"""
              text = text.replace("</body>", css + "</body>")
              page.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name "Learning Hub Updates"
          git config user.email "updates@learninghubtutoring.com"
          git rm .github/workflows/restore-checkout-modules.yml
          git add index.html
          git commit -m "Restore resource booking and payment gateway"
          git push
